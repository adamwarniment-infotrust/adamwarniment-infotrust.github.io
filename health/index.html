<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMP Health Check · InfoTrust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
:root{
  --page:#FFFFFF; --tint:#E9F3FF; --tint-2:#F6F9FC; --card:#FFFFFF; --navy:#084A87; --blue:#0A6DC4; --glow:#2388FF;
  --ink:#2C374F; --ink-2:#57606A; --ink-3:#677489; --ink-4:#97A3B7; --line:#E2E8F0; --line-2:#EAEEF3;
  --orange:#F75E29; --orange-d:#E24E1B; --yes:#1E8E5A; --no:#C2410C; --mint:#68D8D5; --shadow:rgba(15,25,40,.22);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F1828; --tint:#14243C; --tint-2:#172238; --card:#1A2640; --navy:#9FCBFF; --blue:#59AFFF; --glow:#2388FF;
    --ink:#EEF2F8; --ink-2:#BCC6D4; --ink-3:#97A3B7; --ink-4:#66728A; --line:#2B3854; --line-2:#24304A;
    --yes:#4ECB8F; --no:#FF8A5C; --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F1828; --tint:#14243C; --tint-2:#172238; --card:#1A2640; --navy:#9FCBFF; --blue:#59AFFF; --glow:#2388FF;
  --ink:#EEF2F8; --ink-2:#BCC6D4; --ink-3:#97A3B7; --ink-4:#66728A; --line:#2B3854; --line-2:#24304A;
  --yes:#4ECB8F; --no:#FF8A5C; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.logo{height:24px;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
header{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,5vw,64px)}
header span{font-size:13px;color:var(--ink-3);font-weight:500}
.btn{font:500 15px Poppins,system-ui,sans-serif;height:46px;padding:0 26px;border-radius:100px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-d)}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
/* intro */
.intro{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 70px);align-items:center;gap:40px;padding:0 clamp(16px,5vw,64px) 40px;max-width:1280px;margin:0 auto}
.intro h1{font-size:clamp(40px,6.4vw,80px);font-weight:300;line-height:1.02;letter-spacing:-.035em;color:var(--navy);margin:14px 0 22px}
.intro h1 strong{font-weight:700;display:block}
.intro p{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:46ch;margin:0 0 30px}
.pillars{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.pillars span{font-size:13px;color:var(--ink-2);background:var(--tint-2);border:1px solid var(--line-2);padding:6px 14px;border-radius:100px}
.preview{position:relative;height:420px}
.preview .pc{position:absolute;left:50%;top:50%;width:min(340px,80vw);height:380px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:0 53px 91px var(--shadow);padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.preview .pc:nth-child(1){transform:translate(-50%,-50%) rotate(-8deg) translateX(-40px);opacity:.5}
.preview .pc:nth-child(2){transform:translate(-50%,-50%) rotate(5deg) translateX(30px);opacity:.75}
.preview .pc:nth-child(3){transform:translate(-50%,-50%);animation:nudge 3.2s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:translate(-50%,-50%)}80%{transform:translate(-44%,-50%) rotate(4deg)}90%{transform:translate(-50%,-50%)}}
/* deck */
.check{max-width:760px;margin:0 auto;padding:10px clamp(16px,4vw,24px) 60px;text-align:center}
.prog{display:flex;gap:6px;justify-content:center;margin:10px 0 26px}
.prog i{width:28px;height:5px;border-radius:5px;background:var(--line-2);transition:background .3s}
.prog i.y{background:var(--yes)} .prog i.n{background:var(--no)} .prog i.c{background:var(--blue)}
.deck{position:relative;height:420px;margin:0 auto;max-width:420px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 53px 91px var(--shadow);
  padding:30px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;user-select:none;cursor:grab;will-change:transform}
.card:active{cursor:grabbing}
.card.under{transform:scale(.94) translateY(18px);opacity:.6;box-shadow:none;pointer-events:none}
.card .pil{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--blue);background:var(--tint);padding:6px 12px;border-radius:100px;align-self:flex-start}
.card h2{font-size:clamp(22px,3.4vw,28px);line-height:1.3;font-weight:600;color:var(--ink);margin:18px 0 0;letter-spacing:-.01em}
.card .ctx{font-size:14px;color:var(--ink-3);line-height:1.55;margin-top:12px}
.card .num{font-size:13px;color:var(--ink-4);font-weight:500}
.stamp{position:absolute;top:26px;font-weight:700;font-size:15px;padding:6px 14px;border-radius:8px;border:2px solid;opacity:0;transition:opacity .1s}
.stamp.y{right:26px;color:var(--yes);border-color:var(--yes)} .stamp.n{left:26px;color:var(--no);border-color:var(--no)}
.choices{display:flex;gap:14px;justify-content:center;margin-top:30px}
.choice{font:600 15px Poppins,sans-serif;height:52px;padding:0 26px;border-radius:100px;cursor:pointer;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:10px;transition:all .2s}
.choice.n:hover{border-color:var(--no);color:var(--no)} .choice.y:hover{border-color:var(--yes);color:var(--yes)}
.kbd{font-size:12.5px;color:var(--ink-4);margin-top:14px}
/* scan */
.scan{max-width:640px;margin:60px auto;text-align:center;padding:0 20px}
.scan h2{color:var(--navy);font-size:28px;margin:22px 0 8px;letter-spacing:-.01em}
.scan p{color:var(--ink-3);margin:0}
.radar{width:200px;height:200px;margin:0 auto;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,var(--tint) 0 1px,transparent 1px 33px);border:1px solid var(--line)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(35,136,255,.55),transparent 28%);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scanlist{margin:26px auto 0;max-width:360px;text-align:left}
.scanlist div{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line-2);color:var(--ink-3);transition:color .3s}
.scanlist div.d{color:var(--ink)}
.scanlist b{font-weight:600}
/* report */
.report{max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,40px) 60px}
.rtop{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,64px);align-items:center;padding:24px 0 40px}
.big{position:relative;width:220px;height:220px}
.big svg{transform:rotate(-90deg)}
.big .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.big .v b{font-size:60px;font-weight:300;color:var(--navy);letter-spacing:-.04em;line-height:1}
.big .v span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.rtop h1{font-size:clamp(30px,4.6vw,54px);font-weight:300;letter-spacing:-.03em;line-height:1.08;color:var(--navy);margin:10px 0 14px}
.rtop h1 strong{font-weight:700}
.rtop p{color:var(--ink-2);font-size:17px;line-height:1.6;max-width:56ch;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:36px}
.pcard{background:var(--tint-2);border:1px solid var(--line-2);border-radius:15px;padding:18px}
.pcard .t{font-size:13px;font-weight:600;color:var(--ink-2)}
.pcard .s{font-size:34px;font-weight:300;letter-spacing:-.03em;margin:6px 0 10px}
.pcard .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pcard .bar i{display:block;height:100%;border-radius:6px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:26px;box-shadow:0 13px 10px rgba(0,0,0,.02)}
.box h3{margin:0 0 4px;font-size:19px;color:var(--navy)}
.box .s{margin:0 0 18px;color:var(--ink-3);font-size:13.5px}
.gap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line-2)}
.gap .q{font-size:14px;color:var(--ink-2);line-height:1.5}
.gap .q b{display:block;color:var(--no);font-size:12px;font-weight:600;margin-bottom:4px}
.gap .f{font-size:14px;line-height:1.5}
.gap .f b{display:block;color:var(--blue);font-size:12px;font-weight:600;margin-bottom:4px}
.closer{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.closer:first-of-type{border-top:0}
.closer .nm{font-weight:600;font-size:15px}
.closer .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
.closer .c{font-weight:700;font-size:15px;white-space:nowrap}
.closer .dots{grid-column:1/-1;display:flex;gap:4px}
.closer .dots i{flex:1;height:6px;border-radius:4px;background:var(--line);transition:background .4s}
.closer.top .dots i.on{background:var(--blue)} .closer .dots i.on{background:var(--ink-4)}
.closer.top .c{color:var(--blue)}
.winbox{margin-top:20px;background:var(--tint);border-radius:12px;padding:18px}
.winbox p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.ctaband{margin-top:36px;border-radius:22px;background:linear-gradient(135deg,#0A6DC4,#084A87);color:#fff;padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.ctaband::after{content:"";position:absolute;left:-100px;bottom:-200px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%)}
.ctaband h2{font-size:clamp(26px,3.6vw,40px);font-weight:300;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15;position:relative}
.ctaband h2 strong{font-weight:700}
.ctaband p{margin:0;color:#DCE9FA;max-width:54ch;position:relative}
.ctaband .b{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.ctaband .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.foot{text-align:center;font-size:12px;color:var(--ink-3);margin-top:22px}
.foot button{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer}
.rise{animation:rise .6s cubic-bezier(.4,0,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:900px){.intro,.two,.rtop,.ctaband{grid-template-columns:1fr}.preview{height:340px}.pgrid{grid-template-columns:1fr 1fr}.gap{grid-template-columns:1fr}.big{margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const TALK="https://infotrust.com/talk-to-us/";
const GMP="https://infotrust.com/what-we-do/google-marketing-platform/";

const PILLARS=[{id:"own",n:"Ownership and cost"},{id:"data",n:"Data quality"},{id:"priv",n:"Privacy"},{id:"act",n:"Activation"}];
const CARDS=[
  {p:"own",q:"Our Google Marketing Platform licenses are in our company’s name, not our agency’s.",ctx:"If the agency relationship ends, does the seat go with them?",
   fix:"Licenses issued to you with full edit access and data portability."},
  {p:"own",q:"We know exactly what we pay for each Google platform, separate from media fees.",ctx:"Platform fees are often blended into retainers.",
   fix:"Clear usage-based rates on spend, impressions and clicks."},
  {p:"data",q:"Our GA4 numbers line up with our backend within a few percent.",ctx:"Think orders, leads or signups.",
   fix:"Implementation review plus the GA4 Scorecard to find where numbers drift."},
  {p:"data",q:"Someone is alerted automatically when tracking breaks.",ctx:"Not when a stakeholder notices a dip in a dashboard.",
   fix:"InfoTrust Suite monitors GA4 and GTM continuously and flags breakage."},
  {p:"priv",q:"We know every tag firing on our sites and what data it collects.",ctx:"Including the ones added by vendors years ago.",
   fix:"Tag Inspector audits every tag and cookie across your sites."},
  {p:"priv",q:"Consent Mode is configured and validated in every market we operate in.",ctx:"Basic or advanced, checked against what actually fires.",
   fix:"Consent configuration checks and Compliance Risk Reports."},
  {p:"act",q:"We use predictive audiences or value-based bidding in our campaigns.",ctx:"The AI features inside DV360, SA360 and Analytics 360.",
   fix:"AI Success Checklist, propensity audiences and value-based bidding support."},
  {p:"act",q:"Our team could run DV360 or CM360 confidently without outside help.",ctx:"Setup, Floodlights, user management and reporting.",
   fix:"Onboarding in days, Floodlight audits, training and the Customer Acceleration Hub."},
];
// Share of each pillar’s gaps that each partner model can close. InfoTrust covers all four.
const CLOSERS=[
  {id:"it",n:"InfoTrust",d:"GMP Sales Partner with governance and privacy tools",cov:{own:1,data:1,priv:1,act:1}},
  {id:"agency",n:"Full-service media agency",d:"Bundled GMP seat inside a media contract",cov:{own:0,data:.25,priv:0,act:.75}},
  {id:"consult",n:"Generalist analytics consultancy",d:"Project-based implementation",cov:{own:0,data:.75,priv:.5,act:.25}},
  {id:"direct",n:"Self-serve, in-house only",d:"Your team handles licenses and support",cov:{own:.75,data:.25,priv:0,act:.25}},
];

function Intro({go}){
  return <section className="intro">
    <div className="rise">
      <div className="eyebrow">Google Marketing Platform health check</div>
      <h1>How healthy is <strong>your GMP setup?</strong></h1>
      <p>Eight quick statements. Swipe right if it’s true for you, left if it’s not yet. You’ll get a score across four areas and a plan to close every gap.</p>
      <button className="btn btn-primary" onClick={go}>Start the Health Check</button>
      <div className="pillars">{PILLARS.map(p=><span key={p.id}>{p.n}</span>)}</div>
    </div>
    <div className="preview" aria-hidden="true">
      {[CARDS[5],CARDS[2],CARDS[0]].map((c,i)=><div className="pc" key={i}>
        <div><div className="eyebrow" style={{color:"var(--blue)"}}>{PILLARS.find(p=>p.id===c.p).n}</div>
        <div style={{fontSize:20,fontWeight:600,lineHeight:1.35,marginTop:14}}>{c.q}</div></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--ink-4)"}}><span>Not yet</span><span>True for us</span></div>
      </div>)}
    </div>
  </section>;
}

function Deck({onDone}){
  const [i,setI]=useState(0); const [ans,setAns]=useState([]);
  const [dx,setDx]=useState(0); const [fly,setFly]=useState(0); const start=useRef(null);
  const decide=useCallback(v=>{
    if(fly) return;
    setFly(v?1:-1);
    setTimeout(()=>{
      const n=[...ans,v]; setAns(n); setFly(0); setDx(0);
      if(n.length===CARDS.length) onDone(n); else setI(x=>x+1);
    },320);
  },[ans,fly,onDone]);
  useEffect(()=>{const k=e=>{if(e.key==="ArrowRight")decide(true);if(e.key==="ArrowLeft")decide(false)};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[decide]);
  const down=e=>{start.current=e.clientX;e.currentTarget.setPointerCapture(e.pointerId)};
  const move=e=>{if(start.current!==null)setDx(e.clientX-start.current)};
  const up=()=>{if(start.current===null)return;start.current=null;if(dx>110)decide(true);else if(dx<-110)decide(false);else setDx(0)};
  const c=CARDS[i], nx=CARDS[i+1];
  const x=fly?fly*700:dx, rot=x/18;
  return <section className="check">
    <div className="prog" aria-label={`Statement ${i+1} of ${CARDS.length}`}>{CARDS.map((_,k)=><i key={k} className={k<ans.length?(ans[k]?"y":"n"):k===i?"c":""}/>)}</div>
    <div className="deck">
      {nx && <div className="card under"><div><span className="pil">{PILLARS.find(p=>p.id===nx.p).n}</span><h2>{nx.q}</h2></div></div>}
      <div className="card" key={i} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        style={{transform:`translateX(${x}px) rotate(${rot}deg)`,transition:start.current!==null?"none":"transform .32s cubic-bezier(.4,0,.2,1)"}}>
        <span className="stamp y" style={{opacity:Math.max(0,x/110)}}>True for us</span>
        <span className="stamp n" style={{opacity:Math.max(0,-x/110)}}>Not yet</span>
        <div><span className="pil">{PILLARS.find(p=>p.id===c.p).n}</span><h2>{c.q}</h2><div className="ctx">{c.ctx}</div></div>
        <div className="num">{i+1} of {CARDS.length}</div>
      </div>
    </div>
    <div className="choices">
      <button className="choice n" onClick={()=>decide(false)}>Not Yet</button>
      <button className="choice y" onClick={()=>decide(true)}>True for Us</button>
    </div>
    <div className="kbd">Swipe the card, tap a button, or use the ← → keys</div>
  </section>;
}

function pillarScores(ans){
  const o={}; PILLARS.forEach(p=>{const idx=CARDS.map((c,k)=>c.p===p.id?k:-1).filter(k=>k>=0); o[p.id]=Math.round(idx.filter(k=>ans[k]).length/idx.length*100)}); return o;
}

function Scan({ans,onDone}){
  const [s,setS]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setS(v=>{if(v>=PILLARS.length){clearInterval(t);setTimeout(onDone,500);return v}return v+1}),550);return()=>clearInterval(t)},[]);
  const ps=pillarScores(ans);
  return <section className="scan">
    <div className="radar"/>
    <h2>Scoring your setup</h2><p>Comparing your answers against GMP best practice.</p>
    <div className="scanlist">{PILLARS.map((p,k)=><div key={p.id} className={k<s?"d":""}><span>{p.n}</span><b>{k<s?ps[p.id]+"%":"…"}</b></div>)}</div>
  </section>;
}

function Report({ans,restart}){
  const ps=pillarScores(ans);
  const total=Math.round(ans.filter(Boolean).length/CARDS.length*100);
  const gaps=CARDS.map((c,k)=>({...c,k})).filter(c=>!ans[c.k]);
  const [go,setGo]=useState(false);
  useEffect(()=>{setTimeout(()=>setGo(true),150);window.scrollTo({top:0,behavior:"smooth"})},[]);
  const R=96,C=2*Math.PI*R;
  const col=v=>v>=75?"var(--yes)":v>=50?"#D99A00":"var(--no)";
  const pool=gaps.length?gaps:CARDS; // with no gaps, rank on keeping every area healthy
  const ranked=CLOSERS.map(cl=>{
    const closed=pool.reduce((a,g)=>a+(cl.cov[g.p]),0);
    return {...cl,closed:Math.round(closed),pct:Math.round(closed/pool.length*100)};
  }).sort((a,b)=>b.pct-a.pct);
  const headline=total>=75?<>A strong base, <strong>with room to lock it in.</strong></>:total>=40?<>Solid in places, <strong>exposed in others.</strong></>:<>Real gaps, <strong>and a clear way to close them.</strong></>;
  return <section className="report">
    <div className="rtop rise">
      <div className="big">
        <svg width="220" height="220"><circle cx="110" cy="110" r={R} stroke="var(--line-2)" strokeWidth="12" fill="none"/>
        <circle cx="110" cy="110" r={R} stroke="var(--blue)" strokeWidth="12" fill="none" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={go?C*(1-total/100):C} style={{transition:"stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)"}}/></svg>
        <div className="v"><div><b>{total}</b><span>GMP health score</span></div></div>
      </div>
      <div>
        <div className="eyebrow">Your health check</div>
        <h1>{headline}</h1>
        <p>{gaps.length?`You have ${gaps.length} open ${gaps.length===1?"gap":"gaps"} across ${new Set(gaps.map(g=>g.p)).size} of 4 areas. Here’s what each one means and who can close it.`:"Every statement was true for you. The work now is keeping it that way as tags, teams and agencies change."}</p>
      </div>
    </div>
    <div className="pgrid">{PILLARS.map((p,k)=><div className="pcard rise" key={p.id} style={{animationDelay:k*.08+"s"}}>
      <div className="t">{p.n}</div><div className="s" style={{color:col(ps[p.id])}}>{ps[p.id]}%</div>
      <div className="bar"><i style={{width:go?ps[p.id]+"%":0,background:col(ps[p.id])}}/></div></div>)}</div>
    <div className="two">
      <div className="box">
        <h3>{gaps.length?"Your gaps and how they close":"How InfoTrust keeps it healthy"}</h3>
        <p className="s">{gaps.length?"Each gap paired with the InfoTrust capability that addresses it.":"Always-on coverage for each area."}</p>
        {(gaps.length?gaps:CARDS.filter((_,k)=>k%2===1)).map(g=><div className="gap" key={g.k??g.q}>
          <div className="q"><b>{gaps.length?"Gap":"Area"}</b>{g.q}</div>
          <div className="f"><b>InfoTrust</b>{g.fix}</div>
        </div>)}
      </div>
      <div className="box">
        <h3>Who closes your gaps</h3>
        <p className="s">Coverage of your {gaps.length||CARDS.length} {gaps.length?"open gaps":"health areas"} by partner model.</p>
        {ranked.map((r,k)=><div className={"closer"+(k===0?" top":"")} key={r.id}>
          <div className="nm">{r.n}<small>{r.d}</small></div>
          <div className="c">{r.pct}%</div>
          <div className="dots">{pool.map((g,j)=><i key={j} className={go&&r.cov[g.p]>=0.5?"on":""} style={{transitionDelay:(k*.15+j*.05)+"s"}}/>)}</div>
        </div>)}
        <div className="winbox">
          <p><b style={{color:"var(--navy)"}}>InfoTrust covers all four areas.</b> Licensing, governance, privacy and enablement from one partner that doesn’t buy media, so it works alongside any agency.</p>
          <a className="btn btn-primary" href={TALK} target="_blank" rel="noopener">Talk to Us</a>
        </div>
      </div>
    </div>
    <div className="ctaband">
      <div><h2>Close your gaps <strong>with InfoTrust.</strong></h2><p>Bring this report to a call with a Google Marketing Platform specialist and leave with a prioritized plan.</p></div>
      <div className="b"><a className="btn btn-primary" href={TALK} target="_blank" rel="noopener">Talk to Us</a><a className="btn btn-secondary" href={GMP} target="_blank" rel="noopener">Explore GMP Services</a></div>
    </div>
    <p className="foot">The GMP Health Check is an InfoTrust tool. <button onClick={restart}>Retake the Health Check</button></p>
  </section>;
}

function App(){
  const [stage,setStage]=useState("intro"); const [ans,setAns]=useState([]);
  return <>
    <header><img className="logo" src={LOGO} alt="InfoTrust"/><span>GMP Health Check</span></header>
    {stage==="intro"&&<Intro go={()=>setStage("deck")}/>}
    {stage==="deck"&&<Deck onDone={a=>{setAns(a);setStage("scan")}}/>}
    {stage==="scan"&&<Scan ans={ans} onDone={()=>setStage("report")}/>}
    {stage==="report"&&<Report ans={ans} restart={()=>{setAns([]);setStage("intro")}}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
