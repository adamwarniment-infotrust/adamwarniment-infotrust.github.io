<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMP Partner Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* Palette: teal/sea-green base (analogous to blue, so blue reads as the harmonious "right" answer),
   a cerulean "sea" tone reserved for the top match, and a warm apricot accent for actions.
   No red anywhere. Every color state also carries an icon, label or pattern. */
:root{
  --bg:#F3FAF8; --bg-2:#E6F3EF; --card:#FFFFFF; --ink:#0D2B33; --ink-2:#36545A; --ink-3:#5A777C; --ink-4:#8EA6A9;
  --line:#D3E5E1; --line-2:#E3EFEC;
  --teal:#0F766E; --teal-soft:#D5EFEA; --sea:#1D6FA5; --sea-soft:#E0EDF8; --sage:#3E7F5E;
  --accent:#F4A259; --accent-ink:#0D2B33; --accent-soft:#FCEBD8; --shadow:rgba(13,43,51,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1C20; --bg-2:#0E252A; --card:#122C31; --ink:#E5F2EF; --ink-2:#B4CCC8; --ink-3:#8AA6A2; --ink-4:#5E7B78;
    --line:#22433F; --line-2:#1A3835; --teal:#2DD4BF; --teal-soft:#123F3A; --sea:#5AA9DD; --sea-soft:#14344A; --sage:#6CC093;
    --accent:#F4A259; --accent-soft:#3A2A1A; --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1C20; --bg-2:#0E252A; --card:#122C31; --ink:#E5F2EF; --ink-2:#B4CCC8; --ink-3:#8AA6A2; --ink-4:#5E7B78;
  --line:#22433F; --line-2:#1A3835; --teal:#2DD4BF; --teal-soft:#123F3A; --sea:#5AA9DD; --sea-soft:#14344A; --sage:#6CC093;
  --accent:#F4A259; --accent-soft:#3A2A1A; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg-2));min-height:100vh;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,5vw,56px)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.mark i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--sea));display:block}
header small{color:var(--ink-3);font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 60px}
.hero{padding:24px 0 8px;max-width:760px}
.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700}
h1{font-size:clamp(30px,4.6vw,48px);line-height:1.08;letter-spacing:-.025em;margin:10px 0 12px}
.lede{font-size:17px;line-height:1.6;color:var(--ink-2);margin:0}
/* mode toggle */
.modes{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:4px;margin:22px 0 6px}
.modes label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:9px 16px;border-radius:100px;cursor:pointer;color:var(--ink-2)}
.modes input{accent-color:var(--teal);margin:0}
.modes label.on{background:var(--teal-soft);color:var(--ink)}
.mhint{font-size:13px;color:var(--ink-3);margin:0 0 18px}
/* questionnaire */
.qa{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}
.q{padding:18px 0;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0;padding-top:0}
.q h3{margin:0 0 4px;font-size:16px}
.q p{margin:0 0 12px;font-size:13px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:100px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ink-4)}
.chip .bx{width:16px;height:16px;border:1.5px solid var(--ink-4);display:grid;place-items:center;flex:none}
.chip.radio .bx{border-radius:50%} .chip.multi .bx{border-radius:4px}
.chip.on{border-color:var(--teal);background:var(--teal-soft)}
.chip.on .bx{background:var(--teal);border-color:var(--teal)}
.chip .bx svg{opacity:0} .chip.on .bx svg{opacity:1}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.reset{background:none;border:0;color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;margin-top:14px}
/* swipe */
.check{max-width:560px;margin:0 auto;text-align:center}
.prog{display:flex;gap:5px;justify-content:center;margin:6px 0 22px}
.prog i{width:26px;height:6px;border-radius:6px;background:var(--line)}
.prog i.c{background:var(--ink-4)}
.prog i.y{background:var(--teal)}
.prog i.n{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.deck{position:relative;height:380px;max-width:420px;margin:0 auto;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 70px var(--shadow);padding:28px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;user-select:none;cursor:grab}
.card.under{transform:scale(.94) translateY(16px);opacity:.55;box-shadow:none;pointer-events:none}
.card h2{font-size:clamp(21px,3.2vw,26px);line-height:1.3;margin:16px 0 0;letter-spacing:-.01em}
.card .ctx{font-size:14px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.tag{display:inline-flex;font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:5px 11px;border-radius:100px;align-self:flex-start}
.stamp{position:absolute;top:22px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;padding:5px 12px;border-radius:8px;border:2px solid;opacity:0}
.stamp.y{right:22px;color:var(--teal);border-color:var(--teal)} .stamp.n{left:22px;color:#B4651F;border-color:var(--accent)}
.choices{display:flex;gap:12px;justify-content:center;margin-top:26px}
.choice{font:600 15px "DM Sans",sans-serif;height:50px;padding:0 22px;border-radius:100px;cursor:pointer;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.choice.n:hover{border-color:var(--accent)} .choice.y:hover{border-color:var(--teal)}
.kbd{font-size:12.5px;color:var(--ink-4);margin-top:12px}
/* results */
.path{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.path .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.path b{display:block;font-size:16px;margin-bottom:3px}
.path span{font-size:14px;color:var(--ink-2);line-height:1.5}
.path.it{background:var(--sea-soft)} .path.it .ic{background:var(--sea)}
.path.ent{background:var(--teal-soft)} .path.ent .ic{background:var(--teal)}
.path.ag{background:var(--accent-soft)} .path.ag .ic{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--ink-3);font-size:14px;line-height:1.6;padding:8px 0}
.mc{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);overflow:hidden;transition:border-color .2s}
.mc.lean{border-color:var(--sea)}
.mc>button.hd{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 16px;cursor:pointer}
.mc>button.hd:focus-visible{outline:3px solid var(--sea);outline-offset:-3px}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--line-2);color:var(--ink-2)}
.mc.lean .rk{background:var(--sea);color:#fff}
.nm{font-weight:700;font-size:15.5px}
.nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;line-height:1.4;margin-top:2px}
.pct{font-weight:700;font-size:17px;text-align:right}
.pct small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.bar{grid-column:2/-1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink-4);transition:width .8s cubic-bezier(.4,0,.2,1)}
.mc.lean .bar i{background:var(--sea)}
.body{padding:0 16px 16px 58px}
.why{margin:0;padding:0;list-style:none}
.why li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:6px}
.why li svg{flex:none;margin-top:3px;color:var(--teal)}
.why li b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:600 14px "DM Sans",sans-serif;height:42px;padding:0 18px;border-radius:100px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn-acc{background:var(--accent);color:var(--accent-ink)} .btn-acc:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)} .btn-ghost:hover{border-color:var(--ink-4)}
.more{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;padding:0 16px 12px 58px}
/* form */
form.lead{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
form.lead .full{grid-column:1/-1}
form.lead label{font-size:12px;font-weight:600;color:var(--ink-2);display:grid;gap:4px}
form.lead input,form.lead textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px}
form.lead textarea{min-height:70px;resize:vertical}
.note{font-size:13px;color:var(--ink-2);line-height:1.5;background:var(--teal-soft);border-radius:10px;padding:12px}
.notfit{border:1.5px dashed var(--ink-4);border-radius:14px;padding:16px;margin-top:6px}
.notfit .t{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;margin-bottom:6px}
.notfit p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.res-full{max-width:760px;margin:0 auto}
.res-full .again{display:flex;justify-content:center;margin-top:18px}
.pn{display:flex;align-items:center;gap:10px}
.plogo{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px;flex:none}
.notfit .plogo{width:28px;height:28px;padding:2px}
.cico{width:18px;height:18px;object-fit:contain}
.cicons{display:flex;gap:6px}
.cicons img{width:30px;height:30px;object-fit:contain;pointer-events:none}
.prods{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.prods span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:5px 12px 5px 6px}
.prods img{width:22px;height:22px;object-fit:contain}
.beta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;padding:8px clamp(16px,5vw,56px);background:var(--ink);color:var(--bg)}
.beta a{color:var(--bg);margin-left:6px}
.beta a[aria-current]{font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
.beta .bs{display:inline-flex;align-items:center;gap:4px;opacity:.8}
.beta .bs.on{opacity:1;font-weight:600}
#ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:0;transform:translate(50vw,105vh);
  transition-property:transform,opacity;transition-duration:550ms,200ms;transition-timing-function:cubic-bezier(.45,0,.2,1)}
#ghost.show{opacity:1}
#ghost svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform-origin:5px 3px;transition:transform .12s}
#ghost.down svg{transform:scale(.82)}
#ghost .rip{position:absolute;left:-13px;top:-13px;width:32px;height:32px;border-radius:50%;border:3px solid var(--sea);opacity:0}
#ghost.tap .rip{animation:rip .5s ease-out}
@keyframes rip{from{opacity:.95;transform:scale(.3)}to{opacity:0;transform:scale(1.7)}}
.simtoast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 10px 9px 16px;border-radius:100px;box-shadow:0 10px 30px var(--shadow)}
.simtoast button{font:600 12.5px "DM Sans",sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:100px;padding:7px 12px;cursor:pointer}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.foot{font-size:12px;color:var(--ink-3);text-align:center;max-width:70ch;margin:34px auto 0;line-height:1.6}
.rise{animation:rise .5s cubic-bezier(.4,0,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:960px){.qa{grid-template-columns:1fr}.side{position:static}}
@media (max-width:520px){.body,.more{padding-left:16px}form.lead{grid-template-columns:1fr}.modes label{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// Where InfoTrust lead forms POST (JSON). Leave empty and the form says it isn't connected yet.
const FORM_ENDPOINT="";
const IT_CONTACT="https://infotrust.com/talk-to-us/";

/* ---------- partners (verify names, URLs and one-liners before launch) ---------- */
const P={
  it:{n:"InfoTrust",logo:"logos/infotrust.png",url:"https://infotrust.com/",d:"Independent Google Marketing Platform partner for licensing, data governance, privacy and team enablement. Doesn’t buy media."},
  cp:{n:"Cardinal Path",logo:"logos/cardinalpath-mark.svg",url:"https://www.cardinalpath.com/",d:"Large analytics and marketing technology consultancy and Google Marketing Platform partner."},
  aw:{n:"Adswerve",logo:"logos/adswerve.png",url:"https://adswerve.com/",d:"Google Marketing Platform and Google Cloud partner with data and media services."},
  mm:{n:"Monks",logo:"logos/monks.png",url:"https://www.monks.com/",d:"Global digital agency covering media, creative and data."},
  ti:{n:"Tinuiti",logo:"logos/tinuiti.png",url:"https://tinuiti.com/",d:"Performance marketing agency across search, social, programmatic and commerce media."},
  wp:{n:"Wpromote",logo:"logos/wpromote.svg",url:"https://www.wpromote.com/",d:"Performance marketing agency covering paid media, creative and analytics."},
};
/* Google Marketing Platform product icons */
const PROD={ga:["logos/ga.png","Analytics 360"],dv:["logos/dv360.png","Display & Video 360"],cm:["logos/cm360.png","Campaign Manager 360"],
  sa:["logos/sa360.png","Search Ads 360"],bq:["logos/bigquery.png","BigQuery"],gmp:["logos/gmp.png","Google Marketing Platform"]};

/* ---------- beta: ?sim=it|ent|ag  (&mode=swipe|form) prefills answers for each pathway ---------- */
const QP=new URLSearchParams(location.search);
const SIM=["it","ent","ag"].includes(QP.get("sim"))?QP.get("sim"):null;
const QMODE=["swipe","form"].includes(QP.get("mode"))?QP.get("mode"):null;
const BETA=!!SIM||QP.has("beta");
const FORM_PRESETS={
  it:{need:["license","audit","privacy","train"],plat:["ga","dv","cm"],spend:["s2"],foot:["f2"],own:["us"],agency:["keep"]},
  ent:{need:["license","audit"],plat:["ga","dv","cm","sa"],spend:["s4"],foot:["f4"],own:["us"],agency:["keep"]},
  ag:{need:["media","creative"],plat:["dv","sa"],spend:["s2"],foot:["f1"],own:["agency"],agency:["replace"]},
};
/* ---------- sim runner: a visible "ghost" cursor that clicks and swipes on its own ---------- */
// Playback pace: 1.7x slower than the base timings; &speed=2 plays twice as fast, &speed=0.5 half as fast.
const SLOW=1.7/Math.min(4,Math.max(.25,parseFloat(QP.get("speed"))||1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
const SimBus=new EventTarget();
const RUN={id:0,active:false};
const Ghost={
  el:null,
  get(){ if(!this.el){ const d=document.createElement("div"); d.id="ghost"; d.setAttribute("aria-hidden","true");
    d.innerHTML='<span class="rip"></span><svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.3-4.1 2.7 6.1 2.6-1.1-2.7-6h6z" fill="#0D2B33" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
    document.body.appendChild(d); this.el=d; } return this.el; },
  async to(x,y,ms=550){ const g=this.get(); g.style.transitionDuration=(ms*SLOW)+"ms,200ms"; g.style.transform=`translate(${x}px,${y}px)`; g.classList.add("show"); await sleep(ms); },
  async tap(){ const g=this.get(); g.classList.add("down"); g.classList.remove("tap"); void g.offsetWidth; g.classList.add("tap"); await sleep(160); g.classList.remove("down"); await sleep(120); },
  down(on){ this.get().classList.toggle("down",on); },
  hide(){ this.el&&this.el.classList.remove("show","down"); },
};
function simState(s){ RUN.active=s==="running"; SimBus.dispatchEvent(new CustomEvent("state",{detail:s})); }
function stopSim(){ if(!RUN.active) return; RUN.id++; Ghost.hide(); simState("stopped"); }
function startRun(){ const id=++RUN.id; simState("running"); const chk=()=>{ if(RUN.id!==id) throw new Error("sim stopped"); }; return chk; }
async function ghostClick(el,chk,{click=true}={}){
  el.scrollIntoView({behavior:"smooth",block:"center"}); await sleep(480); chk();
  const r=el.getBoundingClientRect(); await Ghost.to(r.left+Math.min(r.width*.5,60),r.top+r.height*.55); chk();
  if(click){ await Ghost.tap(); chk(); el.click(); await sleep(260); }
}
async function finishOnInfoTrust(chk){
  await sleep(900); chk();
  const hd=document.querySelector('[data-pid="it"]');
  if(hd){ await ghostClick(hd,chk); await sleep(500); chk();
    const cta=document.querySelector('[data-intent="review"]'); if(cta) await ghostClick(cta,chk,{click:false}); }
  else { const ag=document.querySelector(".notfit .btn"); if(ag) await ghostClick(ag,chk,{click:false}); }
  await sleep(1400); chk(); Ghost.hide(); simState("done");
}

// order matches CARDS: media, creative, own, gov, privacy, enable, keep, big, cloud
const SWIPE_PRESETS={
  it:[false,false,true,true,true,true,true,false,false],
  ent:[false,false,true,true,false,false,true,true,false],
  ag:[true,true,false,false,false,false,false,false,false],
};
const WHY={
  ent:{cp:"Built for global, enterprise-scale analytics programs.",aw:"A strong fit when Google Cloud and BigQuery sit at the center.",mm:"A strong fit when media and creative run alongside the platforms."},  it:{aw:"Worth comparing if data engineering is your main need.",cp:"Worth comparing for large, multi-year consulting engagements."},
  ag:{mm:"Media and creative under one roof.",ti:"Performance media across many channels.",wp:"Paid media with in-house creative."},
};
const IT_WHY={
  own:["Your licenses, your data","Seats in your company’s name with full edit access and data portability."],
  lic:["Clear platform pricing","Usage-based rates kept separate from any media fees."],
  gov:["Data you can trust","Continuous GA4 and GTM monitoring flags broken tracking before reports do."],
  privacy:["Privacy built in","Tag and cookie audits plus Consent Mode checks in every market."],
  enable:["A team that owns it","Onboarding and training so your team runs GMP without outside help."],
  keep:["Works alongside your agency","Doesn’t buy media, so there’s no conflict with the agency you keep."],
  def:["One partner across the stack","Licensing and support for Analytics 360, DV360, CM360 and SA360."],
};

/* ---------- questionnaire ---------- */
const QS=[
  {id:"need",multi:true,t:"What do you need a partner to do?",h:"Pick everything that applies.",o:[
    ["media","Plan, buy and run our media"],["creative","Create our ads and creative"],["license","License and set up Google platforms"],
    ["audit","Audit and monitor our tracking"],["privacy","Privacy and consent compliance"],["train","Train our team to run it ourselves"],["data","Build data pipelines in BigQuery"]]},
  {id:"plat",multi:true,t:"Which Google platforms do you use or plan to use?",h:"",o:[
    ["ga","GA4 / Analytics 360"],["dv","DV360"],["cm","CM360"],["sa","SA360"],["bq","BigQuery"],["none","None yet"]]},
  {id:"spend",t:"Annual media through Google platforms",h:"A ballpark is fine.",o:[["s1","Under $1M"],["s2","$1M–$10M"],["s3","$10M–$50M"],["s4","Over $50M"]]},
  {id:"foot",t:"Sites, brands or markets you measure",h:"",o:[["f1","1–5"],["f2","6–20"],["f3","21–50"],["f4","50+ worldwide"]]},
  {id:"own",t:"Who should own your platform seats and data?",h:"",o:[["us","We should"],["agency","Our agency is fine"],["unsure","Not sure"]]},
  {id:"agency",t:"Do you work with a media agency today?",h:"",o:[["no","No"],["keep","Yes, and we’re keeping them"],["replace","Yes, but we’re looking to replace them"]]},
];
function sigFromForm(a){
  const has=(q,v)=>(a[q]||[]).includes(v);
  return {
    media:has("need","media"),creative:has("need","creative"),lic:has("need","license"),gov:has("need","audit"),
    privacy:has("need","privacy"),enable:has("need","train"),cloud:has("need","data")||has("plat","bq"),
    own:has("own","us")||has("own","unsure"),keep:has("agency","keep"),replace:has("agency","replace"),
    big:(has("spend","s4")&&(has("foot","f3")||has("foot","f4")))||(has("foot","f4")&&has("spend","s3")),
    mediaPlat:["dv","cm","sa"].filter(p=>has("plat",p)).length,
    answered:QS.filter(q=>(a[q.id]||[]).length).length,
  };
}

/* ---------- swipe ---------- */
const CARDS=[
  {k:"media",tag:"Media",ic:["dv","sa"],q:"We want a partner to plan, buy and run our media campaigns.",ctx:"Day-to-day campaign execution, not just the platforms."},
  {k:"creative",tag:"Media",ic:["cm"],q:"We need someone to create our ads and creative.",ctx:"Display, video and search assets."},
  {k:"own",tag:"Ownership",ic:["gmp"],q:"Our Google platform licenses should be in our own company’s name.",ctx:"If a partner relationship ends, the seats and data stay with you."},
  {k:"gov",tag:"Data quality",ic:["ga"],q:"Our tracking needs an independent audit or ongoing monitoring.",ctx:"Numbers that drift from the backend, tags nobody owns."},
  {k:"privacy",tag:"Privacy",ic:["ga","cm"],q:"Privacy and consent compliance is a priority this year.",ctx:"Consent Mode, cookie audits, regional rules."},
  {k:"enable",tag:"Team",ic:["ga","dv","cm","sa"],q:"We want our team to run Google Marketing Platform confidently on its own.",ctx:"Setup, reporting and the AI features inside the tools."},
  {k:"keep",tag:"Agency",ic:["dv"],q:"We already have a media agency we plan to keep.",ctx:"Looking for help alongside them, not instead of them."},
  {k:"big",tag:"Scale",ic:["gmp"],q:"We spend over $50M a year on media across many markets.",ctx:"Global programs with regional teams."},
  {k:"cloud",tag:"Data",ic:["bq"],q:"Our data team lives in BigQuery and Google Cloud.",ctx:"Warehousing, pipelines and modeling."},
];
function sigFromSwipe(ans){
  const s={media:false,creative:false,lic:false,gov:false,privacy:false,enable:false,cloud:false,own:false,keep:false,replace:false,big:false,mediaPlat:0};
  CARDS.forEach((c,i)=>{if(ans[i]) s[c.k]=true});
  s.lic=s.own; s.answered=ans.length; return s;
}

/* ---------- matching: three pathways ---------- */
function match(s){
  const agPts=(s.media?2:0)+(s.creative?2:0)+(s.replace?1:0);
  const itPts=[s.own,s.lic,s.gov,s.privacy,s.enable,s.keep].filter(Boolean).length;
  let path="it";
  if(!s.keep && agPts>=2 && agPts>itPts) path="ag";
  else if(s.big) path="ent";
  const itScore=Math.min(97,86+itPts*2+(s.cloud?1:0));
  let list;
  if(path==="it"){
    list=[{id:"it",s:itScore},{id:"aw",s:66+(s.cloud?8:0)},{id:"cp",s:62+(s.big?6:0)}];
  } else if(path==="ent"){
    const first=s.cloud?"aw":"cp", third=s.mediaPlat>=2||s.media?"mm":(first==="aw"?"cp":"aw");
    const it=Math.min(90,84+itPts);
    list=[{id:first,s:it+3},{id:"it",s:it},{id:third,s:it-7}];
  } else {
    const first=s.creative?"mm":"ti";
    list=[{id:first,s:90},{id:first==="mm"?"ti":"mm",s:85},{id:"wp",s:81}];
  }
  list.sort((a,b)=>b.s-a.s);
  const why=[]; ["own","lic","gov","privacy","enable","keep"].forEach(k=>s[k]&&why.push(IT_WHY[k])); why.push(IT_WHY.def);
  return {path,list,itWhy:why.slice(0,3)};
}

/* ---------- icons ---------- */
const Ic={
  check:(z=14)=><svg width={z} height={z} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>,
  x:(z=14)=><svg width={z} height={z} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>,
  out:<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>,
  star:<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>,
  globe:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>,
  mega:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" aria-hidden="true"><path d="M3 10v4h4l6 4V6L7 10zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>,
  chev:o=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transform:o?"rotate(180deg)":"none",transition:"transform .2s"}} aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>,
};
const PATHS={
  it:{cls:"it",ic:Ic.star,t:"Best match: an independent GMP partner",d:"Your answers point to owning your licenses, trusting your data and building your team’s skills, not media buying."},
  ent:{cls:"ent",ic:Ic.globe,t:"Enterprise scale: compare the top three",d:"At your size, a large global partner and a focused specialist both make sense. Shortlist all three."},
  ag:{cls:"ag",ic:Ic.mega,t:"You’re looking for a full-service media agency",d:"You want a partner to plan, buy and run campaigns and make the ads. That’s a media agency’s job."},
};

/* ---------- lead form (InfoTrust only) ---------- */
const INTENTS=[["review","Request a free stack review"],["pricing","Get licensing pricing"],["call","Talk to a specialist"]];
function LeadForm({intent,summary,onClose}){
  const [st,setSt]=useState("idle");
  const label=(INTENTS.find(i=>i[0]===intent)||["","Agency support"])[1];
  const submit=async e=>{
    e.preventDefault();
    const data=Object.fromEntries(new FormData(e.target)); data.intent=label; data.answers=summary;
    if(!FORM_ENDPOINT){setSt("unwired");return}
    setSt("sending");
    try{const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});setSt(r.ok?"done":"err")}catch{setSt("err")}
  };
  if(st==="done") return <div className="note" role="status">Thanks. A Google Marketing Platform specialist will reply within one business day.</div>;
  if(st==="unwired") return <div className="note" role="status">This proof of concept isn’t connected to a form yet. <a href={IT_CONTACT} target="_blank" rel="noopener">Contact InfoTrust directly</a>.</div>;
  return <form className="lead" onSubmit={submit}>
    <div className="full" style={{fontWeight:700,fontSize:14}}>{label}</div>
    <label>Name<input name="name" required autoComplete="name"/></label>
    <label>Work email<input name="email" type="email" required autoComplete="email"/></label>
    <label className="full">Company<input name="company" required autoComplete="organization"/></label>
    <label className="full">Anything we should know?<textarea name="note" defaultValue={`My match results: ${summary}`}/></label>
    <div className="full" style={{display:"flex",gap:8}}>
      <button className="btn btn-acc" disabled={st==="sending"}>{st==="sending"?"Sending…":"Send"}</button>
      <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
    </div>
    {st==="err"&&<div className="full note">That didn’t go through. Try again or <a href={IT_CONTACT} target="_blank" rel="noopener">contact InfoTrust directly</a>.</div>}
  </form>;
}

/* ---------- results ---------- */
function MatchCard({row,rank,m,summary,go,open,setOpen}){
  const p=P[row.id], isIt=row.id==="it";
  const [intent,setIntent]=useState(null);
  const why=isIt?m.itWhy:[[null,WHY[m.path][row.id]]];
  // Brand emphasis only when InfoTrust is the #1 match; at #2 it looks like every other card.
  return <div className={"mc"+(isIt&&rank===0?" lean":"")}>
    <button className="hd" data-pid={row.id} aria-expanded={open} onClick={()=>setOpen(open?null:row.id)}>
      <span className="rk">{rank+1}</span>
      <span className="nm"><span className="pn"><img className="plogo" src={p.logo} alt="" width="34" height="34"/>{p.n}</span><small>{p.d}</small></span>
      <span className="pct">{row.s}%<small>match</small></span>
      <span className="bar"><i style={{width:go?row.s+"%":0}}/></span>
    </button>
    {!open&&<div className="more">{Ic.chev(false)} {isIt?"See why and next steps":"See why"}</div>}
    {open&&<div className="body rise">
      <ul className="why">{why.map((w,i)=><li key={i}>{Ic.check()}<span>{w[0]&&<b>{w[0]}. </b>}{w[1]}</span></li>)}</ul>
      {isIt
        ? <><div className="acts">{INTENTS.map(([k,l])=><button key={k} data-intent={k} className={"btn "+(k==="review"?"btn-acc":"btn-ghost")} aria-pressed={intent===k} onClick={()=>setIntent(k)}>{l}</button>)}</div>
            {intent&&<LeadForm key={intent} intent={intent} summary={summary} onClose={()=>setIntent(null)}/>}</>
        : <div className="acts"><a className="btn btn-ghost" href={p.url} target="_blank" rel="noopener">Visit {p.n} {Ic.out}</a></div>}
    </div>}
  </div>;
}

function Results({s,summary}){
  const m=useMemo(()=>match(s),[JSON.stringify(s)]);
  const [go,setGo]=useState(false); const [open,setOpen]=useState(null); const [agForm,setAgForm]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setGo(true),80);return()=>clearTimeout(t)},[]);
  useEffect(()=>setOpen(null),[m.path]);
  const pa=PATHS[m.path];
  return <div>
    <div className={"path "+pa.cls}><div className="ic">{pa.ic}</div><div><b>{pa.t}</b><span>{pa.d}</span></div></div>
    {m.list.map((r,i)=><MatchCard key={r.id} row={r} rank={i} m={m} summary={summary} go={go} open={open===r.id} setOpen={setOpen}/>)}
    {m.path==="ag"&&<div className="notfit">
      <div className="t"><img className="plogo" src={P.it.logo} alt="" width="28" height="28"/>{Ic.x(16)} Not a match for this: InfoTrust</div>
      <p>InfoTrust doesn’t buy media or create ads. It licenses and supports Google Marketing Platform and works alongside agencies. If your agency needs a licensing or data governance partner, InfoTrust can help with that part.</p>
      {!agForm?<div className="acts"><button className="btn btn-ghost" onClick={()=>setAgForm(true)}>Ask about agency support</button></div>
        :<LeadForm intent="agency" summary={summary} onClose={()=>setAgForm(false)}/>}
    </div>}
  </div>;
}

/* ---------- modes ---------- */
function Questionnaire(){
  const [a,setA]=useState({});
  useEffect(()=>{
    if(!SIM) return;
    const skip=()=>{stopSim();setA(FORM_PRESETS[SIM]);simState("done")};
    SimBus.addEventListener("skip",skip);
    const chk=startRun();
    (async()=>{try{
      await sleep(700); chk();
      for(const q of QS) for(const v of (FORM_PRESETS[SIM][q.id]||[])){
        const el=document.querySelector(`[data-chip="${q.id}:${v}"]`); if(el) await ghostClick(el,chk);
      }
      await finishOnInfoTrust(chk);
    }catch(e){}})();
    return()=>{SimBus.removeEventListener("skip",skip);stopSim()};
  },[]);
  const tog=(q,v)=>setA(x=>{
    const cur=x[q.id]||[];
    if(!q.multi) return {...x,[q.id]:cur[0]===v?[]:[v]};
    let n=cur.includes(v)?cur.filter(y=>y!==v):[...cur,v];
    if(q.id==="plat") n=v==="none"?(cur.includes("none")?[]:["none"]):n.filter(y=>y!=="none");
    return {...x,[q.id]:n};
  });
  const s=sigFromForm(a);
  const summary=QS.map(q=>(a[q.id]||[]).length?`${q.t} ${(a[q.id]).map(v=>q.o.find(o=>o[0]===v)[1]).join(", ")}`:null).filter(Boolean).join(" | ");
  return <div className="qa">
    <div className="panel">
      {QS.map(q=><div className="q" key={q.id}>
        <h3>{q.t}</h3>{q.h&&<p>{q.h}</p>}
        <div className="chips" role={q.multi?"group":"radiogroup"} aria-label={q.t}>
          {q.o.map(([v,l])=>{const on=(a[q.id]||[]).includes(v);return <button key={v} data-chip={q.id+":"+v} className={"chip "+(q.multi?"multi":"radio")+(on?" on":"")}
            role={q.multi?"checkbox":"radio"} aria-checked={on} onClick={()=>tog(q,v)}><span className="bx"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>{q.id==="plat"&&PROD[v]&&<img className="cico" src={PROD[v][0]} alt="" width="18" height="18"/>}{l}</button>})}
        </div>
      </div>)}
      {s.answered>0&&<button className="reset" onClick={()=>setA({})}>Clear answers</button>}
    </div>
    <div className="side" aria-live="polite">
      <div className="eyebrow" style={{marginBottom:10}}>Your top matches</div>
      {(a.need||[]).length||s.answered>=2
        ? <Results s={s} summary={summary}/>
        : <div className="panel empty">Start with what you need a partner to do. Your top three matches update as you answer.</div>}
    </div>
  </div>;
}

function Swipe(){
  const [ans,setAns]=useState([]); const [i,setI]=useState(0);
  const [dx,setDx]=useState(0); const [fly,setFly]=useState(0); const start=useRef(null);
  const done=ans.length===CARDS.length;
  const decide=useCallback(v=>{
    if(fly||done) return; setFly(v?1:-1);
    setTimeout(()=>{setAns(a=>a.length<CARDS.length?[...a,v]:a);setFly(0);setDx(0);setI(x=>x+1)},RUN.active?300*SLOW:300);
  },[fly,done]);
  useEffect(()=>{
    if(!SIM) return;
    const pre=SWIPE_PRESETS[SIM];
    const skip=()=>{stopSim();setFly(0);setDx(0);setAns(pre);setI(CARDS.length);simState("done")};
    SimBus.addEventListener("skip",skip);
    const chk=startRun();
    (async()=>{try{
      await sleep(600); chk();
      document.querySelector(".deck").scrollIntoView({behavior:"smooth",block:"center"}); await sleep(500);
      for(let k=0;k<CARDS.length;k++){
        chk(); const card=document.querySelector(".deck .card:not(.under)"); if(!card) break;
        const r=card.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height*.45, dir=pre[k]?1:-1;
        await Ghost.to(cx,cy,k?380:600); chk(); await sleep(450); chk();   // pause to "read" the card
        Ghost.down(true); setDx(dir*170); await Ghost.to(cx+dir*170,cy+12,320); chk();
        decide(pre[k]); Ghost.down(false); await sleep(420);
      }
      await finishOnInfoTrust(chk);
    }catch(e){}})();
    return()=>{SimBus.removeEventListener("skip",skip);stopSim()};
  },[]);
  useEffect(()=>{const k=e=>{if(e.key==="ArrowRight")decide(true);if(e.key==="ArrowLeft")decide(false)};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[decide]);
  useEffect(()=>{if(done) window.scrollTo({top:0,behavior:"smooth"})},[done]);
  if(done){
    const summary=CARDS.map((c,k)=>`${ans[k]?"True":"Not yet"}: ${c.q}`).join(" | ");
    return <div className="res-full rise">
      <div className="eyebrow" style={{marginBottom:10}}>Your top matches</div>
      <Results s={sigFromSwipe(ans)} summary={summary}/>
      <div className="again"><button className="btn btn-ghost" onClick={()=>{setAns([]);setI(0)}}>Start over</button></div>
    </div>;
  }
  const down=e=>{start.current=e.clientX;e.currentTarget.setPointerCapture(e.pointerId)};
  const move=e=>{if(start.current!==null)setDx(e.clientX-start.current)};
  const up=()=>{if(start.current===null)return;start.current=null;if(dx>100)decide(true);else if(dx<-100)decide(false);else setDx(0)};
  const c=CARDS[i], nx=CARDS[i+1], x=fly?fly*700:dx;
  return <section className="check">
    <div className="prog" aria-label={`Statement ${i+1} of ${CARDS.length}`}>{CARDS.map((_,k)=><i key={k} className={k<ans.length?(ans[k]?"y":"n"):k===i?"c":""}/>)}</div>
    <div className="deck">
      {nx&&<div className="card under"><div><span className="tag">{nx.tag}</span><h2>{nx.q}</h2></div></div>}
      <div className="card" key={i} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        style={{transform:`translateX(${x}px) rotate(${x/18}deg)`,transition:start.current!==null?"none":`transform ${RUN.active?.3*SLOW:.3}s cubic-bezier(.4,0,.2,1)`}}>
        <span className="stamp y" style={{opacity:Math.max(0,x/100)}}>{Ic.check()} True for us</span>
        <span className="stamp n" style={{opacity:Math.max(0,-x/100)}}>{Ic.x()} Not yet</span>
        <div><span className="tag">{c.tag}</span><h2>{c.q}</h2><div className="ctx">{c.ctx}</div></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"var(--ink-4)"}}>{i+1} of {CARDS.length}</span>
          <span className="cicons">{c.ic.map(k=><img key={k} src={PROD[k][0]} alt={PROD[k][1]} title={PROD[k][1]} width="30" height="30" draggable="false"/>)}</span>
        </div>
      </div>
    </div>
    <div className="choices">
      <button className="choice n" onClick={()=>decide(false)}>{Ic.x()} Not yet</button>
      <button className="choice y" onClick={()=>decide(true)}>{Ic.check()} True for us</button>
    </div>
    <div className="kbd">Swipe the card, tap a button, or use the ← → keys</div>
  </section>;
}

function App(){
  const [mode,setMode]=useState(()=>{if(QMODE) return QMODE;try{return localStorage.getItem("gmp-mode")||"swipe"}catch{return "swipe"}});
  useEffect(()=>{try{localStorage.setItem("gmp-mode",mode)}catch{}},[mode]);
  const M=[["swipe","Swipe cards"],["form","Questionnaire"]];
  const SIMS=[["it","InfoTrust #1"],["ent","Enterprise (InfoTrust #2)"],["ag","Media agency"]];
  const [sim,setSim]=useState(SIM?"running":null);
  useEffect(()=>{
    if(!SIM) return;
    const on=e=>setSim(e.detail);
    // Any real click or key press hands control back to the tester.
    const take=e=>{ if(e.isTrusted&&RUN.active&&!(e.target.closest&&e.target.closest(".simtoast"))) stopSim(); };
    SimBus.addEventListener("state",on); window.addEventListener("pointerdown",take,true); window.addEventListener("keydown",take,true);
    return()=>{SimBus.removeEventListener("state",on);window.removeEventListener("pointerdown",take,true);window.removeEventListener("keydown",take,true)};
  },[]);
  const simName=SIM&&SIMS.find(s=>s[0]===SIM)[1];
  return <>
    {SIM&&sim&&<div className="simtoast" role="status">
      {sim==="running"?<><span className="dotlive"/>Simulating: {simName}. Click anywhere to take over.
        <button onClick={()=>SimBus.dispatchEvent(new Event("skip"))}>Skip to results</button></>
       :<>{sim==="done"?"Simulation finished.":"You’ve taken over."}<button onClick={()=>location.reload()}>Replay</button></>}
    </div>}
    {BETA&&<div className="beta" role="navigation" aria-label="Beta pathway simulator">
      <b>Beta · simulate a pathway</b>
      {SIMS.map(([k,l])=><span key={k} className={"bs"+(SIM===k?" on":"")}>{SIM===k&&Ic.check(12)}{l}:
        <a href={`?sim=${k}&mode=swipe`} aria-current={SIM===k&&mode==="swipe"?"page":undefined}>swipe</a>
        <a href={`?sim=${k}&mode=form`} aria-current={SIM===k&&mode==="form"?"page":undefined}>questionnaire</a></span>)}
      <a href="?beta">clear</a>
    </div>}
    <header><div className="mark"><i/>GMP Partner Match</div><small>Free · about 2 minutes</small></header>
    <div className="wrap">
      <section className="hero">
        <div className="eyebrow">Google Marketing Platform</div>
        <h1>Find the right partner for your Google stack</h1>
        <p className="lede">Answer a few questions and get your top three matches, whether you need a licensing and data partner, an enterprise consultancy or a full-service media agency.</p>
        <div className="prods" aria-label="Platforms covered">{["ga","dv","cm","sa","bq"].map(k=><span key={k}><img src={PROD[k][0]} alt="" width="22" height="22"/>{PROD[k][1]}</span>)}</div>
        <div className="modes" role="radiogroup" aria-label="Answer mode">
          {M.map(([k,l])=><label key={k} className={mode===k?"on":""}><input type="radio" name="mode" value={k} checked={mode===k} onChange={()=>setMode(k)}/>{l}</label>)}
        </div>
        <p className="mhint">{mode==="swipe"?"Nine quick statements. Swipe right if it’s true for you.":"Pick what applies and filter your matches as you go."}</p>
      </section>
      {mode==="swipe"?<Swipe/>:<Questionnaire/>}
      <p className="foot">GMP Partner Match is provided by InfoTrust. Match scores are illustrative and reflect InfoTrust’s view of the market. Partner names belong to their owners, who aren’t affiliated with this tool.</p>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
