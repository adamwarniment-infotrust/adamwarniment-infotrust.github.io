<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMP Partner Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
/* Own brand (not InfoTrust's): teal/sea-green base, cerulean for the publisher's pick, apricot for actions.
   No red. Every color state also carries an icon, label or pattern. No Google or partner logos. */
:root{
  --bg:#F3FAF8; --bg-2:#E6F3EF; --card:#FFFFFF; --ink:#0D2B33; --ink-2:#36545A; --ink-3:#5A777C; --ink-4:#8EA6A9;
  --line:#D3E5E1; --line-2:#E3EFEC;
  --teal:#0F766E; --teal-soft:#D5EFEA; --sea:#1D6FA5; --sea-soft:#E0EDF8; --sage:#3E7F5E;
  --accent:#F4A259; --accent-ink:#0D2B33; --accent-soft:#FCEBD8; --shadow:rgba(13,43,51,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1C20; --bg-2:#0E252A; --card:#122C31; --ink:#E5F2EF; --ink-2:#B4CCC8; --ink-3:#8AA6A2; --ink-4:#5E7B78;
    --line:#22433F; --line-2:#1A3835; --teal:#2DD4BF; --teal-soft:#123F3A; --sea:#5AA9DD; --sea-soft:#14344A; --sage:#6CC093;
    --accent:#F4A259; --accent-soft:#3A2A1A; --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1C20; --bg-2:#0E252A; --card:#122C31; --ink:#E5F2EF; --ink-2:#B4CCC8; --ink-3:#8AA6A2; --ink-4:#5E7B78;
  --line:#22433F; --line-2:#1A3835; --teal:#2DD4BF; --teal-soft:#123F3A; --sea:#5AA9DD; --sea-soft:#14344A; --sage:#6CC093;
  --accent:#F4A259; --accent-soft:#3A2A1A; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg-2));min-height:100vh;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
a{color:var(--sea)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,5vw,56px)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:7px 12px;border-radius:100px}
nav a[aria-current]{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.disc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px clamp(16px,5vw,56px)}
.disc svg{color:var(--teal);flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 60px}
.hero{padding:24px 0 8px;max-width:780px}
.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700}
h1{font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.025em;margin:10px 0 12px}
h2.sec{font-size:22px;letter-spacing:-.01em;margin:28px 0 10px}
.lede{font-size:17px;line-height:1.6;color:var(--ink-2);margin:0}
/* squircle icons (products and partner monograms) */
.sq{display:inline-grid;place-items:center;flex:none;width:var(--s,34px);height:var(--s,34px);position:relative;color:#fff;font-weight:700;font-size:calc(var(--s,34px)*.4);letter-spacing:-.02em}
.sq svg{position:absolute;inset:0;width:100%;height:100%}
.sq b{position:relative;font-weight:700}
.prods{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.prods span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:4px 12px 4px 5px}
/* mode toggle */
.modes{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:4px;margin:22px 0 6px}
.modes label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:9px 16px;border-radius:100px;cursor:pointer;color:var(--ink-2)}
.modes input{accent-color:var(--teal);margin:0}
.modes label.on{background:var(--teal-soft);color:var(--ink)}
.mhint{font-size:13px;color:var(--ink-3);margin:0 0 18px}
/* questionnaire */
.qa{display:grid;grid-template-columns:1fr 440px;gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}
.q{padding:18px 0;border-top:1px solid var(--line-2)}
.q:first-child{border-top:0;padding-top:0}
.q h3{margin:0 0 4px;font-size:16px}
.q p{margin:0 0 12px;font-size:13px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:100px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ink-4)}
.chip .bx{width:16px;height:16px;border:1.5px solid var(--ink-4);display:grid;place-items:center;flex:none}
.chip.radio .bx{border-radius:50%} .chip.multi .bx{border-radius:4px}
.chip.on{border-color:var(--teal);background:var(--teal-soft)}
.chip.on .bx{background:var(--teal);border-color:var(--teal)}
.chip .bx svg{opacity:0} .chip.on .bx svg{opacity:1}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.reset{background:none;border:0;color:var(--ink-3);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;margin-top:14px}
/* swipe */
.check{max-width:560px;margin:0 auto;text-align:center}
.prog{display:flex;gap:5px;justify-content:center;margin:6px 0 22px}
.prog i{width:24px;height:6px;border-radius:6px;background:var(--line)}
.prog i.c{background:var(--ink-4)} .prog i.y{background:var(--teal)}
.prog i.n{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,var(--accent-soft) 3px 6px)}
.deck{position:relative;height:380px;max-width:420px;margin:0 auto;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 70px var(--shadow);padding:28px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;user-select:none;cursor:grab}
.card.under{transform:scale(.94) translateY(16px);opacity:.55;box-shadow:none;pointer-events:none}
.card h2{font-size:clamp(21px,3.2vw,26px);line-height:1.3;margin:16px 0 0;letter-spacing:-.01em}
.card .ctx{font-size:14px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.tag{display:inline-flex;font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:5px 11px;border-radius:100px;align-self:flex-start}
.stamp{position:absolute;top:22px;display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;padding:5px 12px;border-radius:8px;border:2px solid;opacity:0}
.stamp.y{right:22px;color:var(--teal);border-color:var(--teal)} .stamp.n{left:22px;color:#B4651F;border-color:var(--accent)}
.choices{display:flex;gap:12px;justify-content:center;margin-top:26px}
.choice{font:600 15px "DM Sans",sans-serif;height:50px;padding:0 22px;border-radius:100px;cursor:pointer;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.choice.n:hover{border-color:var(--accent)} .choice.y:hover{border-color:var(--teal)}
.kbd{font-size:12.5px;color:var(--ink-4);margin-top:12px}
.cicons{display:flex;gap:6px}
/* results */
.rdisc{font-size:12.5px;color:var(--ink-2);background:var(--card);border:1px dashed var(--ink-4);border-radius:10px;padding:8px 12px;margin-bottom:12px;line-height:1.5}
.path{display:flex;gap:14px;align-items:flex-start;border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.path .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.path b{display:block;font-size:16px;margin-bottom:3px}
.path span{font-size:14px;color:var(--ink-2);line-height:1.5}
.path.std{background:var(--sea-soft)} .path.std .ic{background:var(--sea)}
.path.ent{background:var(--teal-soft)} .path.ent .ic{background:var(--teal)}
.path.ag{background:var(--accent-soft)} .path.ag .ic{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--ink-3);font-size:14px;line-height:1.6}
.mc{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.mc.lean{border-color:var(--sea)}
.mc>button.hd{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 16px;cursor:pointer}
.mc>button.hd:focus-visible{outline:3px solid var(--sea);outline-offset:-3px;border-radius:14px}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--line-2);color:var(--ink-2)}
.mc.lean .rk{background:var(--sea);color:#fff}
.nm{font-weight:700;font-size:15.5px;min-width:0}
.pn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;line-height:1.4;margin-top:3px}
.pct{font-weight:700;font-size:17px;text-align:right}
.pct small{display:block;font-size:11px;color:var(--ink-3);font-weight:500}
.bar{grid-column:2/-1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink-4);transition:width .8s cubic-bezier(.4,0,.2,1)}
.mc.lean .bar i{background:var(--sea)}
.pick{position:relative;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--sea);background:var(--sea-soft);border:1px solid var(--sea);padding:2px 8px;border-radius:100px;cursor:help}
.pick .tip{position:absolute;left:0;top:calc(100% + 6px);width:260px;z-index:20;background:var(--ink);color:var(--bg);font-weight:400;font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
.pick:hover .tip,.pick:focus .tip{opacity:1}
.draft{font-size:11px;font-weight:600;color:var(--ink-3);border:1px dashed var(--ink-4);padding:1px 7px;border-radius:100px}
.body{padding:0 16px 16px 58px}
.why{margin:0;padding:0;list-style:none}
.why li{display:flex;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-bottom:6px}
.why li svg{flex:none;margin-top:3px;color:var(--teal)}
.src{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:600 14px "DM Sans",sans-serif;height:42px;padding:0 18px;border-radius:100px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn-acc{background:var(--accent);color:var(--accent-ink)} .btn-acc:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)} .btn-ghost:hover{border-color:var(--ink-4)}
.more{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:5px;padding:0 16px 12px 58px}
.notfit{border:1.5px dashed var(--ink-4);border-radius:14px;padding:16px;margin:6px 0 10px;background:var(--card)}
.notfit .t{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px;margin-bottom:6px}
.notfit p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.box h3{margin:0 0 8px;font-size:15px}
.box ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.box .s{font-size:12px;color:var(--ink-3);margin:8px 0 0}
/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:440px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600}
td .y{color:var(--teal);display:inline-flex;align-items:center;gap:4px;font-weight:600}
td .n{color:var(--ink-4)}
/* forms */
form.lead{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
form.lead .full{grid-column:1/-1}
form.lead label{font-size:12px;font-weight:600;color:var(--ink-2);display:grid;gap:4px}
form.lead label.cb{display:flex;gap:8px;align-items:flex-start;font-weight:500;font-size:12.5px;line-height:1.45}
form.lead label.cb input{margin-top:2px;accent-color:var(--teal)}
form.lead input:not([type=checkbox]),form.lead textarea,form.lead select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px}
form.lead textarea{min-height:70px;resize:vertical}
.note{font-size:13px;color:var(--ink-2);line-height:1.5;background:var(--teal-soft);border-radius:10px;padding:12px}
/* browse */
.browse{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
.filters .grp{margin-bottom:16px}
.filters h4{margin:0 0 8px;font-size:13px}
.filters label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--teal)}
.search{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:100px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.pcard .top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.pcard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pcard .tags span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:100px;padding:3px 9px;color:var(--ink-2)}
.cmpbox{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.cmpbox input{accent-color:var(--teal)}
.count{font-size:13px;color:var(--ink-3);margin:0 0 10px}
/* method */
.doc{max-width:820px}
.doc p,.doc li{font-size:15px;line-height:1.65;color:var(--ink-2)}
.doc h2{margin-top:30px}
/* beta + sim */
.beta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;padding:8px clamp(16px,5vw,56px);background:var(--ink);color:var(--bg)}
.beta a{color:var(--bg);margin-left:6px}
.beta a[aria-current]{font-weight:700;text-decoration:none;border-bottom:2px solid var(--accent)}
.beta .bs{display:inline-flex;align-items:center;gap:4px;opacity:.8}
.beta .bs.on{opacity:1;font-weight:600}
#ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;opacity:0;transform:translate(50vw,105vh);
  transition-property:transform,opacity;transition-duration:550ms,200ms;transition-timing-function:cubic-bezier(.45,0,.2,1)}
#ghost.show{opacity:1}
#ghost svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));transform-origin:5px 3px;transition:transform .12s}
#ghost.down svg{transform:scale(.82)}
#ghost .rip{position:absolute;left:-13px;top:-13px;width:32px;height:32px;border-radius:50%;border:3px solid var(--sea);opacity:0}
#ghost.tap .rip{animation:rip .5s ease-out}
@keyframes rip{from{opacity:.95;transform:scale(.3)}to{opacity:0;transform:scale(1.7)}}
.simtoast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 32px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 10px 9px 16px;border-radius:100px;box-shadow:0 10px 30px var(--shadow)}
.simtoast button{font:600 12.5px "DM Sans",sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:100px;padding:7px 12px;cursor:pointer}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.foot{font-size:12px;color:var(--ink-3);text-align:center;max-width:78ch;margin:34px auto 0;line-height:1.6}
.rise{animation:rise .5s cubic-bezier(.4,0,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:960px){.qa,.browse{grid-template-columns:1fr}.side{position:static}}
@media (max-width:520px){.body,.more{padding-left:16px}form.lead{grid-template-columns:1fr}.modes label{padding:9px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ================= config ================= */
const FORM_ENDPOINT="";                       // InfoTrust marketing form endpoint (JSON POST). Empty = not wired.
const IT_CONTACT="https://infotrust.com/talk-to-us/";
const PRIVACY_URL="https://infotrust.com/infotrust-cookie-privacy-policy/";
const GDIR="https://marketingplatform.google.com/about/partners/find-a-partner";
const CHECKED="2026-11-23";
const PUB=6;            // publisher weighting added to InfoTrust's score (disclosed)
const IT_MIN=60;        // InfoTrust must reach this fit before weighting to appear at all
const SHOW_MIN=55;      // any partner below this fit is left off the shortlist
const CORRECTION_OWNER="Partner Finder team at InfoTrust (named owner TBD)";

/* ================= taxonomy ================= */
const LIC={ga:"Analytics 360",dv:"Display & Video 360",cm:"Campaign Manager 360",sa:"Search Ads 360"};
const SVC={ // [label, weight]. Weights are published on the methodology page.
  impl:["Implementation and setup",1.5], gov:["Data quality and governance",2], privacy:["Privacy and consent",2],
  train:["Training and enablement",1], cloud:["BigQuery and Google Cloud",1], switch:["Reseller switch support",1.5],
  media:["Media buying",1], creative:["Creative production",1],
};
const REG={na:"North America",emea:"Europe, Middle East and Africa",apac:"Asia-Pacific",latam:"Latin America"};
const SCALE={1:"Mid-market",2:"Enterprise",3:"Global enterprise"};

/* ================= partner catalog (public claims, DRAFT: verify each before launch) ================= */
const site=(u,l="Partner website")=>[l,u];
const CAT=[
  {id:"it",n:"InfoTrust",hq:"Cincinnati, OH, US",cc:"US",lic:["ga","dv","cm"],svc:["impl","gov","privacy","train","cloud","switch"],reg:["na","emea"],scale:2,
   note:"GMP Sales Partner focused on analytics, privacy and data quality. Doesn’t buy media.",url:"https://infotrust.com/",src:[site("https://infotrust.com/")]},
  {id:"cp",n:"Merkle / Cardinal Path",hq:"Chicago, IL, US",cc:"US",lic:["ga","dv","cm","sa"],svc:["impl","gov","privacy","train","media","creative","cloud","switch"],reg:["na","emea","apac","latam"],scale:3,
   note:"Full-stack GMP reseller (part of dentsu) covering media and data at scale.",url:"https://www.cardinalpath.com/",src:[site("https://www.cardinalpath.com/")]},

/* ================= scoring engine ================= */
// Fit (0–100) = licenses 25 + services 35 + region 15 + scale 15 + trigger 10. InfoTrust gets +PUB after that.
function scorePartner(p,n){
  const gates=[];
  const regs=n.region==="global"?["na","emea","apac","latam"]:[n.region];
  const missReg=regs.filter(r=>!p.reg.includes(r)); if(missReg.length) gates.push(`doesn’t serve ${list(missReg.map(r=>REG[r]))}`);
  const missLic=n.lic.filter(l=>!p.lic.includes(l)); if(missLic.length) gates.push(`doesn’t resell ${list(missLic.map(l=>LIC[l]))}`);
  const missHard=["media","creative"].filter(s=>n.svc.includes(s)&&!p.svc.includes(s)); if(missHard.length) gates.push(`doesn’t offer ${list(missHard.map(s=>SVC[s][0].toLowerCase()))}`);
  const need=n.svc, wNeed=need.reduce((a,s)=>a+SVC[s][1],0), wHave=need.filter(s=>p.svc.includes(s)).reduce((a,s)=>a+SVC[s][1],0);
  const svc=wNeed?35*wHave/wNeed:28;
  const scale=15-7.5*Math.abs(p.scale-n.scale);
  const trig=n.trigger==="switch"?(p.svc.includes("switch")?10:0):10;
  const base=Math.round(25+svc+15+scale+trig);   // licenses/region are full when not gated
  const pub=p.id==="it"?PUB:0;
  return {id:p.id,base,total:base+pub,score:Math.min(100,base+pub),pub,gates,matched:need.filter(s=>p.svc.includes(s)),missing:need.filter(s=>!p.svc.includes(s))};
}
function rank(n){
  const all=CAT.map(p=>scorePartner(p,n));
  const ok=r=>!r.gates.length&&r.base>=SHOW_MIN&&(r.id!=="it"||r.base>=IT_MIN);
  const sorted=all.filter(ok).sort((a,b)=>b.total-a.total||a.id.localeCompare(b.id));
  const top=sorted.slice(0,3);
  const it=all.find(r=>r.id==="it");
  const noPub=all.filter(ok).sort((a,b)=>b.base-a.base||a.id.localeCompare(b.id));
  const itRankNoPub=noPub.findIndex(r=>r.id==="it")+1;
  let itOut=null;
  if(!top.some(r=>r.id==="it")){
    itOut=it.gates.length?{why:`InfoTrust ${list(it.gates)}.`,kind:"gate"}
      :it.base<IT_MIN?{why:`InfoTrust scored ${it.base} on fit, below the ${IT_MIN} it needs to be listed.`,kind:"low"}
      :{why:`Three partners scored higher on fit for your answers.`,kind:"rank"};
  }
  const path=n.svc.includes("media")||n.svc.includes("creative")?"ag":n.scale===3?"ent":"std";
  return {top,it,itOut,itRankNoPub,path};
}
function whyText(r,n){
  const p=BYID[r.id], out=[];
  if(n.lic.length) out.push(`Resells ${list(n.lic.map(l=>LIC[l]))}, which you need.`);
  if(r.matched.length) out.push(`Offers ${list(r.matched.map(s=>SVC[s][0].toLowerCase()))}.`);
  if(r.missing.length) out.push(`Doesn’t list ${list(r.missing.map(s=>SVC[s][0].toLowerCase()))}.`);
  out.push(`Serves ${n.region==="global"?"all regions":REG[n.region]}${p.scale===n.scale?`, sized for ${SCALE[n.scale].toLowerCase()} programs`:""}.`);
  if(n.trigger==="switch"&&p.svc.includes("switch")) out.push("Supports moving licenses from another reseller.");
  if(r.id==="it") out.push(`Includes a +${PUB} publisher weighting because InfoTrust runs this site.`);
  return out;
}

const INTENTS=[["review","Request a free stack review"],["pricing","Get licensing pricing"],["call","Talk to a specialist"]];
function LeadForm({intent,n,shortlist,onClose}){
  const [st,setSt]=useState("idle");
  const label=(INTENTS.find(i=>i[0]===intent)||["","Agency support"])[1];
  const discovery={products:n.lic.map(l=>LIC[l]).concat(n.bq?["BigQuery"]:[]),needs:n.svc.map(s=>SVC[s][0]),region:n.region,scale:SCALE[n.scale],
    trigger:n.trigger&&optLabel("trigger",n.trigger),timeline:n.timeline&&optLabel("timeline",n.timeline),industry:n.industry&&optLabel("industry",n.industry)};
  const submit=async e=>{
    e.preventDefault();
    const data=Object.fromEntries(new FormData(e.target)); data.intent=label; data.discovery=discovery; data.shortlist=shortlist; data.consent=true;
    if(!FORM_ENDPOINT){setSt("unwired");return}
    setSt("sending");
    try{const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});setSt(r.ok?"done":"err")}catch{setSt("err")}
  };
  if(st==="done") return <div className="note" role="status">Thanks. An InfoTrust specialist will reply within one business day.</div>;
  if(st==="unwired") return <div className="note" role="status">This beta isn’t connected to InfoTrust’s form yet, so nothing was sent. <a href={IT_CONTACT} target="_blank" rel="noopener">Contact InfoTrust directly</a>.</div>;
  return <form className="lead" onSubmit={submit}>
    <div className="full" style={{fontWeight:700,fontSize:14}}>{label} <span style={{fontWeight:400,color:"var(--ink-3)"}}>· goes to InfoTrust only</span></div>

    <label className="full">Anything we should know?<textarea name="note"/></label>
    <label className="full cb"><input type="checkbox" name="consent_infotrust" required/>
      <span>Share my contact details and answers with InfoTrust so it can reply to this request. They won’t be shared with any other partner. <a href={PRIVACY_URL} target="_blank" rel="noopener">Privacy policy</a></span></label>
    <div className="full" style={{display:"flex",gap:8}}>
      <button className="btn btn-acc" disabled={st==="sending"}>{st==="sending"?"Sending…":"Send to InfoTrust"}</button>
      <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
    </div>
    {st==="err"&&<div className="full note">That didn’t go through. Try again or <a href={IT_CONTACT} target="_blank" rel="noopener">contact InfoTrust directly</a>.</div>}
  </form>;
}

function Questionnaire(){
  const [a,setA]=useState({});
  useEffect(()=>{
    if(!SIM) return;
    const skip=()=>{stopSim();setA(FORM_PRESETS[SIM]);simState("done")};
    SimBus.addEventListener("skip",skip);
    const chk=startRun();
    (async()=>{try{
      await readFor("",1500); chk();
      for(const q of QS){
        const box=document.querySelector(`[data-q="${q.id}"]`);
        if(box){ box.scrollIntoView({behavior:"smooth",block:"center"}); await sleep(450); chk();
          const r=box.querySelector("h3").getBoundingClientRect(); await Ghost.to(r.left+Math.min(r.width,220),r.top+r.height/2); chk();
          await readFor(q.t+" "+q.h,700); chk(); await scanFor(q.o.map(o=>o[1]).join(" ")); chk(); }
        for(const v of (FORM_PRESETS[SIM][q.id]||[])){
          const el=document.querySelector(`[data-chip="${q.id}:${v}"]`); if(el){ await ghostClick(el,chk); await readFor("",500); chk(); }

      }

    }catch(e){}})();
    return()=>{SimBus.removeEventListener("skip",skip);stopSim()};
  },[]);

    const cur=x[q.id]||[];

            role={q.multi?"checkbox":"radio"} aria-checked={on} onClick={()=>tog(q,v)}><span className="bx"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>{q.id==="plat"&&<Prod k={v} s={20}/>}{l}</button>})}
        </div>
      </div>)}
      {n.answered>0&&<button className="reset" onClick={()=>setA({})}>Clear answers</button>}

      <div className="eyebrow" style={{marginBottom:10}}>Your top matches</div>
      {n.ready?<Results n={n}/>:<div className="panel empty">Start with what you need a partner to do or which platforms you need. Your top three matches update as you answer.</div>}
    </div>
  </div>;

function Swipe(){
  const [ans,setAns]=useState([]); const [i,setI]=useState(0);
  const [dx,setDx]=useState(0); const [fly,setFly]=useState(0); const start=useRef(null);
  const done=ans.length===CARDS.length;
  const decide=useCallback(v=>{
    if(fly||done) return; setFly(v?1:-1);
    setTimeout(()=>{setAns(a=>a.length<CARDS.length?[...a,v]:a);setFly(0);setDx(0);setI(x=>x+1)},RUN.active?300*SLOW:300);
  },[fly,done]);
  useEffect(()=>{
    if(!SIM) return;
    const pre=SWIPE_PRESETS[SIM];
    const skip=()=>{stopSim();setFly(0);setDx(0);setAns(pre);setI(CARDS.length);simState("done")};
    SimBus.addEventListener("skip",skip);
    const chk=startRun();
    (async()=>{try{
      await readFor("",1500); chk();
      document.querySelector(".deck").scrollIntoView({behavior:"smooth",block:"center"}); await sleep(500);
      for(let k=0;k<CARDS.length;k++){
        chk(); const card=document.querySelector(".deck .card:not(.under)"); if(!card) break;
        const r=card.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height*.45, dir=pre[k]?1:-1;
        await readFor(CARDS[k].q+" "+CARDS[k].ctx,800); chk();
        await Ghost.to(cx,cy,k?380:600); chk(); await sleep(250); chk();
        Ghost.down(true); setDx(dir*170); await Ghost.to(cx+dir*170,cy+12,320); chk();
        decide(pre[k]); Ghost.down(false); await sleep(420);
      }
      await finishOnInfoTrust(chk);
    }catch(e){}})();
    return()=>{SimBus.removeEventListener("skip",skip);stopSim()};
  },[]);
  useEffect(()=>{const k=e=>{if(e.key==="ArrowRight")decide(true);if(e.key==="ArrowLeft")decide(false)};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[decide]);
  useEffect(()=>{if(done) window.scrollTo({top:0,behavior:"smooth"})},[done]);
  if(done) return <div className="rise" style={{maxWidth:780,margin:"0 auto"}}>
    <div className="eyebrow" style={{marginBottom:10}}>Your top matches</div>
    <Results n={needsFromSwipe(ans)}/>
    <div style={{display:"flex",justifyContent:"center",marginTop:18}}><button className="btn btn-ghost" onClick={()=>{setAns([]);setI(0)}}>Start over</button></div>
  </div>;
  const down=e=>{start.current=e.clientX;e.currentTarget.setPointerCapture(e.pointerId)};
  const move=e=>{if(start.current!==null)setDx(e.clientX-start.current)};
  const up=()=>{if(start.current===null)return;start.current=null;if(dx>100)decide(true);else if(dx<-100)decide(false);else setDx(0)};
  const c=CARDS[i], nx=CARDS[i+1], x=fly?fly*700:dx;
  return <section className="check">
    <div className="prog" aria-label={`Statement ${i+1} of ${CARDS.length}`}>{CARDS.map((_,k)=><i key={k} className={k<ans.length?(ans[k]?"y":"n"):k===i?"c":""}/>)}</div>
    <div className="deck">
      {nx&&<div className="card under"><div><span className="tag">{nx.tag}</span><h2>{nx.q}</h2></div></div>}
      <div className="card" key={i} onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
        style={{transform:`translateX(${x}px) rotate(${x/18}deg)`,transition:start.current!==null?"none":`transform ${RUN.active?.3*SLOW:.3}s cubic-bezier(.4,0,.2,1)`}}>
        <span className="stamp y" style={{opacity:Math.max(0,x/100)}}>{Ic.check()} True for us</span>
        <span className="stamp n" style={{opacity:Math.max(0,-x/100)}}>{Ic.x()} Not yet</span>
        <div><span className="tag">{c.tag}</span><h2>{c.q}</h2><div className="ctx">{c.ctx}</div></div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"var(--ink-4)"}}>{i+1} of {CARDS.length}</span>
          <span className="cicons">{c.ic.map(k=><Prod key={k} k={k} s={30}/>)}</span>
        </div>
      </div>
    </div>
    <div className="choices">
      <button className="choice n" onClick={()=>decide(false)}>{Ic.x()} Not yet</button>
      <button className="choice y" onClick={()=>decide(true)}>{Ic.check()} True for us</button>
    </div>
    <div className="kbd">Swipe the card, tap a button, or use the ← → keys</div>
  </section>;
}

      <label className="full">Source that supports the change<input name="source" type="url" placeholder="https://"/></label>
      <label className="full cb"><input type="checkbox" required name="consent"/><span>InfoTrust can use these details to review and reply to this correction. <a href={PRIVACY_URL} target="_blank" rel="noopener">Privacy policy</a></span></label>
      <div className="full"><button className="btn btn-acc" disabled={st==="sending"}>{st==="sending"?"Sending…":"Send correction"}</button></div>
      {st==="err"&&<div className="full note">That didn’t go through. Please try again.</div>}
    </form>}
  </div>;
}

/* ================= app shell ================= */
const viewFromHash=()=>{const h=location.hash.replace("#","").split("?")[0];return ["browse","method","correct"].includes(h)?h:"match"};
function App(){
  const [view,setView]=useState(SIM?"match":viewFromHash());
  useEffect(()=>{const f=()=>{setView(viewFromHash());window.scrollTo(0,0)};window.addEventListener("hashchange",f);return()=>window.removeEventListener("hashchange",f)},[]);
  const SIMS=[["it","InfoTrust #1"],["ent","Enterprise (InfoTrust #2)"],["ag","Media agency"],["out","InfoTrust drops out"]];
  const [sim,setSim]=useState(SIM?"running":null);
  useEffect(()=>{
    if(!SIM) return;
    const on=e=>setSim(e.detail);
    const take=e=>{ if(e.isTrusted&&RUN.active&&!(e.target.closest&&e.target.closest(".simtoast"))) stopSim(); };
    SimBus.addEventListener("state",on); window.addEventListener("pointerdown",take,true); window.addEventListener("keydown",take,true);
    return()=>{SimBus.removeEventListener("state",on);window.removeEventListener("pointerdown",take,true);window.removeEventListener("keydown",take,true)};
  },[]);
  const NAV=[["match","Find a match","#"],["browse","Browse partners","#browse"],["method","How ranking works","#method"]];
  const curMode=QMODE||"swipe";
  return <>
    {BETA&&<div className="beta" role="navigation" aria-label="Beta pathway simulator">
      <b>Beta · simulate a pathway</b>
      {SIMS.map(([k,l])=><span key={k} className={"bs"+(SIM===k?" on":"")}>{SIM===k&&Ic.check(12)}{l}:
        <a href={`?sim=${k}&mode=swipe`} aria-current={SIM===k&&curMode==="swipe"?"page":undefined}>swipe</a>
        <a href={`?sim=${k}&mode=form`} aria-current={SIM===k&&curMode==="form"?"page":undefined}>questionnaire</a></span>)}
      <a href="?beta">clear</a>
    </div>}
    {SIM&&sim&&<div className="simtoast" role="status">
      {sim==="running"?<><span className="dotlive"/>Simulating: {SIMS.find(s=>s[0]===SIM)[1]}. Click anywhere to take over.
        <button onClick={()=>SimBus.dispatchEvent(new Event("skip"))}>Skip to results</button></>
       :<>{sim==="done"?"Simulation finished.":"You’ve taken over."}<button onClick={()=>location.reload()}>Replay</button></>}
    </div>}
    <header>
      <a className="mark" href="#"><Sq t="PF" c="#0F766E" s={28}/>GMP Partner Finder</a>
      <nav aria-label="Main">{NAV.map(([k,l,h])=><a key={k} href={h} aria-current={view===k?"page":undefined}>{l}</a>)}</nav>
    </header>
    <div className="disc">{Ic.info}<span>Built and operated by <b>InfoTrust</b>, a Google Marketing Platform Sales Partner. InfoTrust is one of the partners listed. <a href="#method">How ranking works</a></span></div>
    <div className="wrap">
      {view==="match"&&<MatchView/>}
      {view==="browse"&&<BrowseView/>}
      {view==="method"&&<MethodView/>}
      {view==="correct"&&<CorrectView/>}
      <p className="foot">GMP Partner Finder is built and operated by InfoTrust, a Google Marketing Platform Sales Partner, and applies a disclosed publisher weighting. <a href="#method">How ranking works</a> · <a href="#correct">Suggest a correction</a>. Not affiliated with or endorsed by Google. Partner and product names belong to their owners.</p>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
