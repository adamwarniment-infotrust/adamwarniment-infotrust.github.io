<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMP Partner Fit Finder · InfoTrust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
:root{
  --navy:#084A87; --blue:#0A6DC4; --glow:#2388FF; --blue-50:#E9F3FF; --orange:#F75E29; --orange-d:#E24E1B;
  --ink:#2C374F; --ink-2:#57606A; --ink-3:#677489; --ink-4:#97A3B7;
  --line:#E2E8F0; --line-2:#EAEEF3; --page:#FBFEFF; --page-2:#E9EBEF; --card:#FFFFFF; --soft:#F6F9FC;
  --ok:#34A853; --chip:#EFF3F9;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8CC2FF; --blue:#59AFFF; --glow:#2388FF; --blue-50:#132A47; --orange:#F75E29; --orange-d:#FF7A4A;
    --ink:#EEF2F8; --ink-2:#B8C2D1; --ink-3:#97A3B7; --ink-4:#6B778C;
    --line:#2A3650; --line-2:#24304A; --page:#0E1626; --page-2:#121C2F; --card:#16213A; --soft:#1A2640; --chip:#1D2A46;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --navy:#8CC2FF; --blue:#59AFFF; --glow:#2388FF; --blue-50:#132A47; --orange:#F75E29; --orange-d:#FF7A4A;
  --ink:#EEF2F8; --ink-2:#B8C2D1; --ink-3:#97A3B7; --ink-4:#6B778C;
  --line:#2A3650; --line-2:#24304A; --page:#0E1626; --page-2:#121C2F; --card:#16213A; --soft:#1A2640; --chip:#1D2A46;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--page),var(--page-2));min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;right:-30vw;top:-40vw;width:90vw;height:90vw;border-radius:50%;
  background:radial-gradient(circle,rgba(35,136,255,.28),rgba(35,136,255,0) 62%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
img{max-width:100%}
.logo{height:26px;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
header{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,5vw,72px)}
.hdr-note{font-size:13px;color:var(--ink-3);font-weight:500}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 80px}
.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-2);font-weight:600}
h1{font-size:clamp(32px,5vw,52px);line-height:1.08;letter-spacing:-.02em;color:var(--navy);margin:14px 0 16px;font-weight:700;max-width:16ch}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:56ch;margin:0 0 32px}
.btn{font:500 15px Poppins,system-ui,sans-serif;height:46px;padding:0 26px;border-radius:100px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .2s cubic-bezier(.4,0,.2,1),background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d)}
.btn-secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:40px 0 20px}
.hero-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:24px;box-shadow:0 53px 91px rgba(15,25,40,.18)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.stat{background:var(--soft);border-radius:10px;padding:14px}
.stat b{display:block;font-size:26px;color:var(--navy);letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink-3);line-height:1.4;display:block}
.how{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:var(--ink-3)}
.how span{background:var(--chip);padding:6px 12px;border-radius:100px}
/* quiz */
.quiz{display:grid;grid-template-columns:1fr 320px;gap:28px;padding-top:24px;align-items:start}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:clamp(20px,4vw,40px);box-shadow:0 13px 10px rgba(0,0,0,.02)}
.progress{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--glow));border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:8px;font-weight:500}
.qtitle{font-size:clamp(22px,3vw,30px);line-height:1.25;color:var(--navy);margin:0 0 8px;letter-spacing:-.01em;font-weight:700}
.qhint{color:var(--ink-2);margin:0 0 24px;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:16px 16px 16px 52px;
  cursor:pointer;position:relative;transition:border-color .2s, background .2s, transform .2s;min-height:72px}
.opt:hover{border-color:var(--line);transform:translateY(-1px)}
.opt b{display:block;font-size:15px;font-weight:600}
.opt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:3px;line-height:1.4}
.opt .tick{position:absolute;left:16px;top:18px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-4);display:grid;place-items:center;transition:all .2s}
.opt.multi .tick{border-radius:6px}
.opt.on{border-color:var(--blue);background:var(--blue-50)}
.opt.on .tick{background:var(--blue);border-color:var(--blue)}
.opt.on .tick svg{opacity:1;transform:scale(1)}
.tick svg{opacity:0;transform:scale(.4);transition:all .2s}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
.txtbtn{background:none;border:0;font:600 14px Poppins,sans-serif;color:var(--ink-2);cursor:pointer;padding:8px 0}
.txtbtn:hover{color:var(--navy)}
.slide{animation:slide .45s cubic-bezier(.4,0,.2,1)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
/* meter */
.meter{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:22px;position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
.meter h3{margin:0 0 4px;font-size:15px;color:var(--ink)}
.meter p{margin:0 0 18px;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.mrow{margin-bottom:14px}
.mrow .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:6px}
.mrow .bar{height:8px;border-radius:8px;background:var(--line-2);overflow:hidden}
.mrow .bar i{display:block;height:100%;border-radius:8px;background:var(--ink-4);transition:width .7s cubic-bezier(.4,0,.2,1)}
.mrow.lead .bar i{background:linear-gradient(90deg,var(--blue),var(--glow))}
.mrow.lead .lab{color:var(--navy);font-weight:600}
.signals{border-top:1px solid var(--line-2);margin-top:18px;padding-top:14px}
.sig{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;margin-bottom:8px;line-height:1.45;animation:pop .4s ease}
.sig svg{flex:none;margin-top:2px;color:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* analyzing */
.analyze{text-align:center;padding:80px 20px}
.ring{width:120px;height:120px;margin:0 auto 26px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--navy)}
.analyze ul{list-style:none;padding:0;margin:20px auto 0;max-width:380px;text-align:left}
.analyze li{font-size:14px;color:var(--ink-3);padding:6px 0;display:flex;gap:10px;align-items:center;transition:color .3s}
.analyze li.done{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);flex:none}
li.done .dot{background:var(--ok)}
/* results */
.res-head{text-align:center;padding:30px 0 10px}
.res-head h1{margin:12px auto;max-width:22ch}
.res-head .lede{margin:0 auto 10px}
.winner{display:grid;grid-template-columns:260px 1fr;gap:32px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:32px;box-shadow:0 53px 91px rgba(15,25,40,.18);margin:32px 0}
.score{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 30% 20%,#529BD2,#0D6EC7);border-radius:12px;color:#fff;padding:24px}
.score big{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score span{font-size:13px;opacity:.9;margin-top:6px;display:block}
.score img{height:22px;filter:brightness(0) invert(1);margin-bottom:16px}
.winner h2{color:var(--navy);margin:0 0 6px;font-size:26px;letter-spacing:-.01em}
.winner .sub{color:var(--ink-2);margin:0 0 18px}
.reasons{display:grid;gap:12px}
.reason{display:flex;gap:12px;align-items:flex-start;animation:pop .5s ease both}
.reason .ic{width:32px;height:32px;border-radius:8px;background:radial-gradient(circle at 30% 20%,#529BD2,#0D6EC7);color:#fff;display:grid;place-items:center;flex:none}
.reason b{display:block;font-size:15px}
.reason span{font-size:14px;color:var(--ink-2);line-height:1.5}
.rank{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:28px;margin-bottom:28px}
.rank h3,.cmp h3{margin:0 0 18px;font-size:20px;color:var(--navy)}
.rrow{display:grid;grid-template-columns:28px 1fr 60px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.rrow:last-child{border-bottom:0}
.rrow .n{font-weight:700;color:var(--ink-3)}
.rrow .nm{font-weight:600;font-size:15px}
.rrow .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
.rrow .bar{height:8px;background:var(--line-2);border-radius:8px;margin-top:8px;overflow:hidden}
.rrow .bar i{display:block;height:100%;border-radius:8px;background:var(--ink-4);width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.rrow.top .bar i{background:linear-gradient(90deg,var(--blue),var(--glow))}
.rrow.top .n,.rrow.top .pct{color:var(--blue)}
.rrow .pct{text-align:right;font-weight:700;font-size:18px}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:28px;margin-bottom:28px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{text-align:left;color:var(--ink-2)}
th{font-size:12.5px;font-weight:600;color:var(--ink-3)}
th.it{color:var(--blue)}
td.it{background:var(--blue-50)}
.y{color:var(--ok)} .p{color:#FBBC04} .n0{color:var(--ink-4)}
.cta{background:#2C374F;color:#fff;border-radius:15px;padding:clamp(28px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(35,136,255,.45),transparent 65%)}
.cta h2{margin:0 0 8px;font-size:clamp(24px,3vw,32px);letter-spacing:-.01em;position:relative}
.cta p{margin:0;color:#C9D2E0;max-width:52ch;position:relative}
.cta .btns{display:flex;gap:12px;flex-wrap:wrap;position:relative}
.cta .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.foot{font-size:12px;color:var(--ink-3);text-align:center;margin-top:28px}
@media (max-width:900px){.hero,.quiz,.winner{grid-template-columns:1fr}.meter{position:static}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function score(ans){
  const t={it:0,agency:0,direct:0,consult:0}; let max=0;
  QS.forEach(q=>{
    const sel=ans[q.id]||[];
    sel.forEach(oid=>{const o=q.opts.find(x=>x.id===oid); Object.keys(t).forEach(k=>t[k]+=o.w[k]);});
    if(sel.length) max+=5*sel.length;
  });
  if(!max) return {it:0,agency:0,direct:0,consult:0};
  const pct={}; Object.keys(t).forEach(k=>pct[k]=t[k]/max);
  const it=Math.min(98,Math.round(86+pct.it*12));
  const out={it};
  ["agency","direct","consult"].forEach(k=>out[k]=Math.min(it-11,Math.round(28+pct[k]*55)));
  return out;
}
function liveScore(ans){
  const answered=QS.filter(q=>(ans[q.id]||[]).length).length;
  if(!answered) return {it:25,agency:25,direct:25,consult:25};
  const s=score(ans); const f=answered/QS.length;
  const mix=v=>Math.round(25+(v-25)*f);
  return {it:mix(s.it),agency:mix(s.agency),direct:mix(s.direct),consult:mix(s.consult)};
}
function pickReasons(ans){
  const r=[]; const has=(q,o)=>(ans[q]||[]).includes(o);
  if(has("own","agency")) r.push(REASONS.agency);
  if(has("own","unsure")) r.push(REASONS.unsure);
  if(has("own","mixed")) r.push(REASONS.mixed);
  ["trust","privacy","fees","value","speed"].forEach(p=>has("pain",p)&&r.push(REASONS[p]));
  if(has("mode","teach")) r.push(REASONS.teach);
  if(has("mode","agency")) r.push(REASONS.modeAgency);
  if(has("sites","c")||has("sites","d")) r.push(REASONS.scale);
  r.push(REASONS.default);
  return r.slice(0,4);
}

      <div className="eyebrow">Google Marketing Platform</div>
      <h1>Find the Right Partner for Your Google Marketing Platform</h1>
      <p className="lede">Six questions about your stack, spend and team. You’ll get a ranked fit across the four ways brands typically source GMP licenses and support.</p>
      <button className="btn btn-primary" onClick={onStart}>Start the Fit Finder</button>
      <div className="how"><span>About 2 minutes</span><span>No email required</span><span>Instant results</span></div>
    </div>
    <div className="hero-card">
      <div className="eyebrow">What we compare</div>
      {PARTNERS.map((p,i)=><div key={p.id} style={{display:"flex",gap:12,padding:"12px 0",borderBottom:i<3?"1px solid var(--line-2)":0}}>
        <div style={{width:8,height:8,borderRadius:8,marginTop:8,background:i===0?"var(--blue)":"var(--ink-4)"}}/>
        <div><b style={{fontSize:15}}>{p.name}</b><div style={{fontSize:13,color:"var(--ink-3)"}}>{p.desc}</div></div>
      </div>)}
      <div className="hero-stats">
        <div className="stat"><b>10+ yrs</b><span>as a Google Marketing Platform partner</span></div>
        <div className="stat"><b>1 of 26</b><span>Google Cloud partners with the Marketing Analytics Specialization</span></div>
      </div>
    </div>
  </section></div>;
}

function Meter({ans}){
  const s=liveScore(ans);
  const order=[...PARTNERS].sort((a,b)=>s[b.id]-s[a.id]);
  const sigs=[]; QS.forEach(q=>(ans[q.id]||[]).forEach(oid=>{const o=q.opts.find(x=>x.id===oid); o.sig&&sigs.push(o.sig);}));
  return <aside className="meter" aria-live="polite">
    <h3>Live fit</h3><p>Updates with every answer.</p>
    {order.map(p=><div key={p.id} className={"mrow"+(p.id==="it"&&s.it>25?" lead":"")}>
      <div className="lab"><span>{p.name}</span><span>{s[p.id]}%</span></div>
      <div className="bar"><i style={{width:s[p.id]+"%"}}/></div>
    </div>)}
    {sigs.length>0 && <div className="signals">{sigs.slice(-4).map((t,i)=><div className="sig" key={t+i}><Check/><span>{t}</span></div>)}</div>}
  </aside>;
}

function Quiz({ans,setAns,onDone}){
  const [i,setI]=useState(0);
  const q=QS[i]; const sel=ans[q.id]||[];
  const toggle=oid=>{
    if(q.multi){
      let n=sel.includes(oid)?sel.filter(x=>x!==oid):[...sel,oid];
      if(q.id==="stack"&&oid==="none") n=sel.includes("none")?[]:["none"];
      else if(q.id==="stack") n=n.filter(x=>x!=="none");
      if(q.max&&n.length>q.max) n=n.slice(-q.max);
      setAns({...ans,[q.id]:n});
    } else {
      setAns({...ans,[q.id]:[oid]});
      setTimeout(()=>next(),380);
    }
  };
  const next=()=>{ if(i<QS.length-1) setI(v=>v+1); else onDone(); };
  return <div className="wrap"><section className="quiz">
    <div className="qcard">
      <div className="qmeta"><span>Question {i+1} of {QS.length}</span><span>{Math.round((i)/QS.length*100)}% complete</span></div>
      <div className="progress"><i style={{width:((i+(sel.length?1:0))/QS.length*100)+"%"}}/></div>
      <div className="slide" key={q.id}>
        <h2 className="qtitle">{q.title}</h2>
        {q.hint && <p className="qhint">{q.hint}</p>}
        <div className="opts" role={q.multi?"group":"radiogroup"}>
          {q.opts.map(o=><button key={o.id} className={"opt"+(q.multi?" multi":"")+(sel.includes(o.id)?" on":"")}
            role={q.multi?"checkbox":"radio"} aria-checked={sel.includes(o.id)} onClick={()=>toggle(o.id)}>
            <span className="tick"><TickW/></span><b>{o.t}</b><small>{o.d}</small>
          </button>)}
        </div>
      </div>
      <div className="qnav">
        <button className="txtbtn" onClick={()=>setI(v=>Math.max(0,v-1))} style={{visibility:i?"visible":"hidden"}}>Back</button>
        {q.multi && <button className="btn btn-primary" disabled={!sel.length} onClick={next}>{i===QS.length-1?"See My Results":"Continue"}</button>}
      </div>
    </div>
    <Meter ans={ans}/>
  </section></div>;
}

function Analyzing({onDone}){
  const steps=["Mapping your Google Marketing Platform stack","Checking seat and data ownership","Weighing governance and privacy needs","Ranking partner models"];
  const [p,setP]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setP(v=>{if(v>=100){clearInterval(t);setTimeout(onDone,350);return 100}return v+2}),40);return()=>clearInterval(t)},[]);
  const C=2*Math.PI*52;
  return <div className="wrap"><div className="analyze">
    <div className="ring"><svg width="120" height="120"><circle cx="60" cy="60" r="52" stroke="var(--line-2)" strokeWidth="8" fill="none"/>
      <circle cx="60" cy="60" r="52" stroke="var(--blue)" strokeWidth="8" fill="none" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*(1-p/100)}/></svg><b>{p}%</b></div>
    <h2 className="qtitle">Building your fit report</h2>
    <ul>{steps.map((s,i)=><li key={s} className={p>(i+1)*24?"done":""}><span className="dot"/>{s}</li>)}</ul>
  </div></div>;
}

function Results({ans,onRestart}){
  const s=score(ans); const reasons=pickReasons(ans);
  const order=[...PARTNERS].sort((a,b)=>s[b.id]-s[a.id]);
  const [go,setGo]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setGo(true),120);window.scrollTo({top:0,behavior:"smooth"});return()=>clearTimeout(t)},[]);
  const rows=[
    ["You own the license, data and edit access",["y","p","y","n0"]],
    ["Transparent, usage-based platform fees",["y","n0","y","n0"]],
    ["No media-buying conflict of interest",["y","n0","y","y"]],
    ["Always-on tracking and privacy monitoring",["y","n0","n0","p"]],
    ["Training and enablement for your team",["y","p","n0","p"]],
    ["Certified reseller across DV360, CM360, SA360, GA360",["y","p","n0","n0"]],
  ];
  const mark={y:<span className="y" aria-label="Yes"><Check s={18}/></span>,p:<span className="p" aria-label="Partial">Partial</span>,n0:<span className="n0" aria-label="No">–</span>};
  return <div className="wrap">
    <section className="res-head">
      <div className="eyebrow">Your results</div>
      <h1>InfoTrust Is Your Strongest Fit</h1>
      <p className="lede">Based on how you run Google Marketing Platform today and where you want to take it.</p>
    </section>
    <section className="winner">
      <div className="score"><div><img src={LOGO} alt=""/><big>{s.it}%</big><span>Fit score</span></div></div>
      <div>
        <h2>Why InfoTrust fits</h2>
        <p className="sub">The answers that moved your score the most.</p>
        <div className="reasons">{reasons.map((r,i)=><div className="reason" key={r[0]} style={{animationDelay:(.15*i)+"s"}}>
          <div className="ic"><Check/></div><div><b>{r[0]}</b><span>{r[1]}</span></div></div>)}</div>
      </div>
    </section>
    <section className="rank">
      <h3>Partner ranking</h3>
      {order.map((p,i)=><div key={p.id} className={"rrow"+(i===0?" top":"")}>
        <div className="n">{i+1}</div>
        <div><div className="nm">{p.name}<small>{p.desc}</small></div><div className="bar"><i style={{width:go?s[p.id]+"%":0,transitionDelay:(i*.15)+"s"}}/></div></div>
        <div className="pct">{s[p.id]}%</div>
      </div>)}
    </section>
    <section className="cmp">
      <h3>How the options compare</h3>
      <div className="tbl"><table>
        <thead><tr><th>What matters</th>{PARTNERS.map(p=><th key={p.id} className={p.id==="it"?"it":""}>{p.name}</th>)}</tr></thead>
        <tbody>{rows.map(r=><tr key={r[0]}><td>{r[0]}</td>{r[1].map((v,i)=><td key={i} className={i===0?"it":""}>{mark[v]}</td>)}</tr>)}</tbody>
      </table></div>
    </section>
    <section className="cta">
      <div><h2>Talk Through Your Results With a GMP Specialist</h2><p>Share your fit report and get a recommended license and support setup for your team.</p></div>
      <div className="btns"><a className="btn btn-primary" href={TALK} target="_blank" rel="noopener">Talk to Us</a><a className="btn btn-secondary" href={GMP} target="_blank" rel="noopener">Explore GMP Services</a></div>
    </section>
    <p className="foot">The GMP Partner Fit Finder is an InfoTrust tool. <button className="txtbtn" style={{fontSize:12}} onClick={onRestart}>Retake the Fit Finder</button></p>
  </div>;
}

function App(){
  const [stage,setStage]=useState("intro"); const [ans,setAns]=useState({});
  return <>
    <Header/>
    {stage==="intro"&&<Intro onStart={()=>setStage("quiz")}/>}
    {stage==="quiz"&&<Quiz ans={ans} setAns={setAns} onDone={()=>setStage("analyze")}/>}
    {stage==="analyze"&&<Analyzing onDone={()=>setStage("results")}/>}
    {stage==="results"&&<Results ans={ans} onRestart={()=>{setAns({});setStage("intro")}}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
